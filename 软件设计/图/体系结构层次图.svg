<svg viewBox="0 0 680 562" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" role="img">
<title>ISA 模拟系统体系结构层次图</title>
<desc>四层体系结构：表示层、服务与集成层、ISA 抽象层、模拟执行内核层，下方为外部依赖。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="26" font-size="14" font-weight="500" fill="#2C2C2A">ISA 模拟系统 体系结构层次图（主风格：层次风格）</text>
<text x="40" y="44" font-size="12" fill="#5F5E5A">上层依赖下层；外部依赖由服务与集成层以子进程或网络方式接入。</text>

<rect x="56" y="60" width="584" height="84" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="68" y="78" font-size="13" font-weight="500" fill="#0C447C">表示层 · Web 前端（MVC）</text>
<rect x="68" y="88" width="132" height="40" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
<text x="134" y="103" font-size="13" fill="#042C53" text-anchor="middle">调试视图</text>
<text x="134" y="118" font-size="12" fill="#185FA5" text-anchor="middle">DebugView</text>
<rect x="210" y="88" width="132" height="40" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
<text x="276" y="103" font-size="13" fill="#042C53" text-anchor="middle">测试与报告视图</text>
<text x="276" y="118" font-size="12" fill="#185FA5" text-anchor="middle">TestView</text>
<rect x="352" y="88" width="132" height="40" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
<text x="418" y="103" font-size="13" fill="#042C53" text-anchor="middle">对拍与归因视图</text>
<text x="418" y="118" font-size="12" fill="#185FA5" text-anchor="middle">DiffView</text>
<rect x="494" y="88" width="132" height="40" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
<text x="560" y="103" font-size="13" fill="#042C53" text-anchor="middle">装载 / ISA / 工作区</text>
<text x="560" y="118" font-size="12" fill="#185FA5" text-anchor="middle">LoadView / IsaView</text>

<path d="M340 144L340 162" stroke="#185FA5" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>

<rect x="56" y="164" width="584" height="84" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="68" y="182" font-size="13" font-weight="500" fill="#0C447C">服务与集成层 · 服务端</text>
<rect x="68" y="192" width="132" height="40" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
<text x="134" y="207" font-size="13" fill="#042C53" text-anchor="middle">集成 API 服务</text>
<text x="134" y="222" font-size="12" fill="#185FA5" text-anchor="middle">ApiEndpoint</text>
<rect x="210" y="192" width="132" height="40" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
<text x="276" y="207" font-size="13" fill="#042C53" text-anchor="middle">调试控制服务</text>
<text x="276" y="222" font-size="12" fill="#185FA5" text-anchor="middle">DebugController</text>
<rect x="352" y="192" width="132" height="40" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
<text x="418" y="207" font-size="13" fill="#042C53" text-anchor="middle">测试编排服务</text>
<text x="418" y="222" font-size="12" fill="#185FA5" text-anchor="middle">TestController</text>
<rect x="494" y="192" width="132" height="40" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
<text x="560" y="207" font-size="13" fill="#042C53" text-anchor="middle">对拍调度服务</text>
<text x="560" y="222" font-size="12" fill="#185FA5" text-anchor="middle">DiffController</text>

<path d="M340 248L340 266" stroke="#185FA5" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>

<rect x="56" y="268" width="584" height="84" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="68" y="286" font-size="13" font-weight="500" fill="#0C447C">ISA 抽象层 · 描述驱动</text>
<rect x="68" y="296" width="132" height="40" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
<text x="134" y="311" font-size="13" fill="#042C53" text-anchor="middle">描述装载与校验</text>
<text x="134" y="326" font-size="12" fill="#185FA5" text-anchor="middle">IsaSpec</text>
<rect x="210" y="296" width="132" height="40" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
<text x="276" y="311" font-size="13" fill="#042C53" text-anchor="middle">指令译码表</text>
<text x="276" y="326" font-size="12" fill="#185FA5" text-anchor="middle">描述驱动生成</text>
<rect x="352" y="296" width="132" height="40" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
<text x="418" y="311" font-size="13" fill="#042C53" text-anchor="middle">架构状态定义</text>
<text x="418" y="326" font-size="12" fill="#185FA5" text-anchor="middle">ArchState</text>
<rect x="494" y="296" width="132" height="40" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
<text x="560" y="311" font-size="13" fill="#042C53" text-anchor="middle">ISA 扩展点</text>
<text x="560" y="326" font-size="12" fill="#185FA5" text-anchor="middle">第二套 ISA</text>

<path d="M340 352L340 370" stroke="#185FA5" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>

<rect x="56" y="372" width="584" height="84" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="68" y="390" font-size="13" font-weight="500" fill="#0C447C">模拟执行内核层 · C++ 库（零 Web 依赖）</text>
<rect x="68" y="400" width="132" height="40" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
<text x="134" y="415" font-size="13" fill="#042C53" text-anchor="middle">执行循环</text>
<text x="134" y="430" font-size="12" fill="#185FA5" text-anchor="middle">取指-译码-写回</text>
<rect x="210" y="400" width="132" height="40" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
<text x="276" y="415" font-size="13" fill="#042C53" text-anchor="middle">架构状态维护</text>
<text x="276" y="430" font-size="12" fill="#185FA5" text-anchor="middle">GPR · 内存 · CSR</text>
<rect x="352" y="400" width="132" height="40" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
<text x="418" y="415" font-size="13" fill="#042C53" text-anchor="middle">轨迹记录</text>
<text x="418" y="430" font-size="12" fill="#185FA5" text-anchor="middle">Trace</text>
<rect x="494" y="400" width="132" height="40" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
<text x="560" y="415" font-size="13" fill="#042C53" text-anchor="middle">终止与异常</text>
<text x="560" y="430" font-size="12" fill="#185FA5" text-anchor="middle">终止序列 · 越界</text>

<path d="M46 414L46 102" stroke="#5F5E5A" stroke-width="0.8" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="40" y="466" font-size="12" fill="#5F5E5A">逐层调用</text>

<rect x="56" y="478" width="584" height="64" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="6 4"/>
<text x="68" y="496" font-size="12" fill="#444441">外部依赖（由第三方或环境提供，不属于本软件）</text>
<rect x="68" y="508" width="132" height="26" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="134" y="525" font-size="12" fill="#2C2C2A" text-anchor="middle">浏览器与宿主 OS</text>
<rect x="210" y="508" width="132" height="26" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="276" y="525" font-size="12" fill="#2C2C2A" text-anchor="middle">外部汇编工具链</text>
<rect x="352" y="508" width="132" height="26" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="418" y="525" font-size="12" fill="#2C2C2A" text-anchor="middle">参考模拟器 Spike</text>
<rect x="494" y="508" width="132" height="26" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="560" y="525" font-size="12" fill="#2C2C2A" text-anchor="middle">Git 托管平台</text>
