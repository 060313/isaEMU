<svg viewBox="0 0 680 616" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" role="img">
<title>ISA 模拟系统子系统与构件图</title>
<desc>表示层 Web 前端子系统、集成 API 子系统、领域服务子系统、比对子系统与外部适配子系统、ISA 抽象子系统与模拟执行内核子系统，以及外部系统与基础设施。</desc>
