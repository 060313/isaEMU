<text x="388.1" y="42" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">SS-7 Web 前端子系统 设计类图</text>
<line x1="44" y1="80" x2="732.2" y2="80" stroke="#e5e7eb" stroke-width="1"/>
<text x="44" y="958.0" font-size="10.5" fill="#6b7280">6 个视图类统一经 HttpApiClient 访问服务端、经 StateStore 集中管理状态（Pinia），视图之间不直接通信</text>
<text x="44" y="975.0" font-size="10.5" fill="#6b7280">DebugView 以 MVC 中的「视图 + 控制器」双重身份承担寄存器 / 内存 / 反汇编 / 轨迹四类子视图（UID 阶段再细化）</text>
<text x="44" y="992.0" font-size="10.5" fill="#6b7280">12 条虚线为依赖：视图先经 HttpApiClient 取服务端数据，再把结果提交给 StateStore；视图之间不直接通信。</text>
