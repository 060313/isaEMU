<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1340" width="1300" height="1340" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif">
<defs><marker id="arr" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="8.6" markerHeight="8.6" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="#4b5563"/></marker></defs>
<rect x="0.5" y="0.5" width="1299.0" height="1339.0" fill="#ffffff" stroke="#e5e7eb"/>
<text x="650.0" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">UC-08 执行用例集 —— 数据操作活动图</text>
<text x="650.0" y="61" text-anchor="middle" font-size="11.5" fill="#6b7280">读取侧只有三条 SELECT，写入侧集中在一个事务内完成；循环体为每个用例独占一个 RunContext</text>
<line x1="44" y1="78" x2="1256.0" y2="78" stroke="#e5e7eb"/>
<circle cx="300.0" cy="108.0" r="10" fill="#111827"/>
