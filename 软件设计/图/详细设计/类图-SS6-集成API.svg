<rect x="0.5" y="0.5" width="695.3" height="697.0" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
<text x="347.7" y="42" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">SS-6 集成 API 子系统 设计类图</text>
<line x1="44" y1="80" x2="651.3" y2="80" stroke="#e5e7eb" stroke-width="1"/>
<text x="44" y="565.0" font-size="10.5" fill="#6b7280">HttpGateway 是唯一对外入口：鉴权（AuthFilter）→ 限额（QuotaGuard）→ 按 op 分发 → 结构化封装</text>
<text x="44" y="582.0" font-size="10.5" fill="#6b7280">StatusChannel 由 SS-5 的 DebugService 驱动推送，前端订阅（跨子系统依赖见《核心对象关系图》）</text>
<text x="44" y="599.0" font-size="10.5" fill="#6b7280">DD-14 组合根 Bootstrapper：全系统唯一装配点，一次决定驱动 / 限额开关 /</text>
<text x="44" y="616.0" font-size="10.5" fill="#6b7280">　端口 / 轨迹默认值四项形态差异；业务代码禁止 new 单例</text>
<text x="44" y="633.0" font-size="10.5" fill="#6b7280">本子系统全部接口为冻结级契约：迭代一即冻结，前端组与服务端组据此并行（NFR-I2、3.2.3 并行策略）。</text>
<text x="44" y="649.0" font-size="10.5" fill="#6b7280">装配次序即依赖次序：驱动 → 模式迁移 → ISA 注册表 → 内核工厂与限额 →</text>
<text x="44" y="665.0" font-size="10.5" fill="#6b7280">服务 → 网关 → 监听自检（见《活动图-服务端构件装配与启动》）。</text>
