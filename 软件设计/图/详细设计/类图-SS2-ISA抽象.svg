<rect x="0.5" y="0.5" width="765.4" height="1260.0" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
<text x="382.7" y="42" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">SS-2 ISA 抽象子系统 设计类图</text>
<line x1="44" y1="80" x2="721.4" y2="80" stroke="#e5e7eb" stroke-width="1"/>
<text x="44" y="1144.0" font-size="10.5" fill="#6b7280">IsaRegistry 是 SS-2 的对外门面，install() 内部编排 parse → validate → build 三步（UC-02 流程协调者）</text>
<text x="44" y="1161.0" font-size="10.5" fill="#6b7280">DecodeTable 是「指令语义不硬编码」的物理落点：内核经它取语义，而它由 ISA 描述文件生成</text>
<text x="44" y="1178.0" font-size="10.5" fill="#6b7280">DD-11 依赖倒置：DecodeTable 实现 SS-1 定义的 IDecodeTable，并把描述层</text>
<text x="44" y="1195.0" font-size="10.5" fill="#6b7280">　编译为执行层语义（m_slots : vector&lt;InsnSemantic&gt;）—— 链接方向 isa → core</text>
<text x="44" y="1212.0" font-size="10.5" fill="#6b7280">跨子系统依赖：IsaRegistry → IStore（SS-5）持久化已装载 ISA 的元数据。</text>
<text x="44" y="1228.0" font-size="10.5" fill="#6b7280">执行期零解析：字符串与位域在装载期一次性编译为 InsnSemantic，内核只做「取第 k 个字段」。</text>
