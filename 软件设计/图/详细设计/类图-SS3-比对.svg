<text x="44" y="715.0" font-size="10.5" fill="#6b7280">CompareEngine 由 TestService（UC-08）与 DiffService（UC-10）共同调用——FR-6.5「两种判定模式复用同一比对引擎」的唯一落点</text>
<text x="44" y="732.0" font-size="10.5" fill="#6b7280">Divergence : StateRecord = 1 : 2（本内核侧 / 基准侧各一份快照）</text>
<text x="44" y="749.0" font-size="10.5" fill="#6b7280">CompareEngine 与两个上层服务之间是「被依赖」关系，故本图不画连线，见《核心对象关系图》。</text>
