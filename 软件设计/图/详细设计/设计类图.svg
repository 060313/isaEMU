<text x="60" y="790" font-size="10" fill="#6b7280">① 每个胶囊为一个设计类（第一行为类名，第二行为中文名）；② 左侧竖线加箭头表示层间依赖方向；③ 行末灰字为该子系统对外部的依赖；</text>
<text x="60" y="804" font-size="10" fill="#6b7280">④ 《IsaRegistry》兼作 ISA 子域门面，编排 UC-02 的 install 流程（IsaSpec::parse → IsaValidator::validate → DecodeTable::build）；⑤ 《Persistence》为 DAO 接口，云端实现为 PgDao、本地实现为 SqliteDao。</text>
