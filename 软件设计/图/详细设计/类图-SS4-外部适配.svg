<text x="641.2" y="42" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">SS-4 外部适配子系统 设计类图</text>
<line x1="44" y1="80" x2="1238.5" y2="80" stroke="#e5e7eb" stroke-width="1"/>
<text x="44" y="424.0" font-size="10.5" fill="#6b7280">端口—适配器：两个适配器实现 SS-4 的端口接口，外部工具链与基准的变化被关在端口后面（可演进级接口）</text>
<text x="44" y="441.0" font-size="10.5" fill="#6b7280">ProcessRunner 为公共基础服务，被两个适配器共用，统一承担超时、输出回收与资源限制</text>
<text x="44" y="458.0" font-size="10.5" fill="#6b7280">RefSimAdapter::parseCommits() 必须容忍未知行与缺失字段（限制 L2），否则 FR-7.5 的降级路径无从触发。</text>
