<rect x="0.5" y="0.5" width="1795.8" height="690.0" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
<text x="897.9" y="42" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">核心对象关系图（含数量关系）</text>
<line x1="44" y1="80" x2="1751.8" y2="80" stroke="#e5e7eb" stroke-width="1"/>
<text x="44" y="591.0" font-size="10.5" fill="#6b7280">本图只画「持久化实体 + 运行时实体」之间的关联与数量关系，作为第 6 章数据设计的依据；行为类的依赖关系见类图</text>
<text x="44" y="608.0" font-size="10.5" fill="#6b7280">数量关系标注在连线两端：1 : 0..n 表示在 n 端表中加外键；n : m 需新增交叉表</text>
<text x="44" y="625.0" font-size="10.5" fill="#6b7280">TestSuite ↔ IsaMeta 为 n : m —— 一个用例集可验证多种 ISA 描述，一条 ISA 描述可被多个用例集引用</text>
<text x="44" y="642.0" font-size="10.5" fill="#6b7280">TestCase : ProgramRecord = 0..n : 1（多用例引用同一程序）；TestReport : CaseResult = 1 : 0..n（一次批量执行产生一份报告）</text>
<text x="44" y="658.0" font-size="10.5" fill="#6b7280">TestSuite : TestReport = 1 : 0..n（同一用例集可被多次执行，报告按时间累积）</text>
