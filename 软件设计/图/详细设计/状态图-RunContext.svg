<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" width="1080" height="580" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif">
<defs><marker id="arr" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="8.6" markerHeight="8.6" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="#4b5563"/></marker></defs>
<rect x="0.5" y="0.5" width="1079.0" height="579.0" fill="#ffffff" stroke="#e5e7eb"/>
<text x="540.0" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">RunContext 类对象状态图</text>
<text x="540.0" y="61" text-anchor="middle" font-size="11.5" fill="#6b7280">一次性对象：随单个测试用例创建与销毁，Disposed 后不可复用（NFR-Q2 的隔离粒度）</text>
<line x1="44" y1="78" x2="1036.0" y2="78" stroke="#e5e7eb"/>
<circle cx="120" cy="150" r="10" fill="#111827"/>
<rect x="70.0" y="190.0" width="180.0" height="54.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<text x="160.0" y="221.5" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">Created</text>
<rect x="310.0" y="190.0" width="190.0" height="54.0" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<text x="405.0" y="221.5" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">Running</text>
<rect x="600.0" y="190.0" width="200.0" height="54.0" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="700.0" y="221.5" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">Compared</text>
<rect x="860.0" y="190.0" width="170.0" height="54.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/>
<text x="945.0" y="221.5" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">Disposed</text>
<rect x="310.0" y="340.0" width="190.0" height="54.0" rx="10" fill="#ffffff" stroke="#be123c" stroke-width="1.6"/>
<text x="405.0" y="371.5" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">Failed</text>
<path d="M120.0 160.0 L120.0 190.0" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<path d="M250.0 217.0 L310.0 217.0" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<text x="280.0" y="209.0" text-anchor="middle" font-size="10" fill="#1f2937">begin()</text>
<path d="M500.0 217.0 L600.0 217.0" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<text x="550.0" y="209.0" text-anchor="middle" font-size="10" fill="#1f2937">finish(verdict)</text>
<path d="M800.0 217.0 L860.0 217.0" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<text x="830.0" y="209.0" text-anchor="middle" font-size="10" fill="#1f2937">drop()</text>
<path d="M405.0 244.0 L405.0 340.0" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<text x="417.0" y="296.0" text-anchor="start" font-size="10" fill="#1f2937">执行异常 / 超时</text>
<path d="M500.0 367.0 L895.0 367.0 L895.0 244.0" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<text x="690.0" y="361.0" text-anchor="middle" font-size="10" fill="#1f2937">finish(Failed) → drop()</text>
<text x="44" y="532.0" font-size="10.5" fill="#6b7280">RunContext 的生命周期严格等于一个测试用例的执行周期；批量执行中不得跨用例复用</text>
<text x="44" y="548.0" font-size="10.5" fill="#6b7280">执行异常 / 超时进入 Failed，但同样经 drop() 释放，不阻断整个用例集的后续用例</text>
<text x="44" y="564.0" font-size="10.5" fill="#6b7280">Compared 表示已拿到判定结果；drop() 后由 TestService 汇总结果并写入 TestReport</text>
</svg>
