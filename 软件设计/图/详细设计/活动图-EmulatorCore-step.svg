<rect x="660.0" y="704.0" width="360.0" height="54.0" rx="9" fill="#ffffff" stroke="#be123c" stroke-width="1.5"/>
<rect x="665.0" y="711.0" width="3.5" height="40.0" rx="1.8" fill="#be123c" opacity="0.75"/>
<text x="840.0" y="726.5" text-anchor="middle" font-size="10.5" fill="#1f2937">TrapUnit::capture(core) → TrapRecord</text>
<text x="840.0" y="743.5" text-anchor="middle" font-size="10.5" fill="#1f2937">置状态 Terminated / Faulted</text>
<rect x="590.9" y="712.0" width="18.2" height="17" rx="3" fill="#ffffff"/>
<text x="600.0" y="724.0" text-anchor="middle" font-size="10" fill="#b45309">是</text>
<line x1="580.0" y1="408.0" x2="580.0" y2="880.0" stroke="#374151" stroke-width="3.2"/>
<path d="M840.0 368.0 L840.0 408.0 L580.0 408.0" fill="none" stroke="#4b5563" stroke-width="1.5"/>
<path d="M840.0 758.0 L840.0 790.0 L580.0 790.0" fill="none" stroke="#4b5563" stroke-width="1.5"/>
<path d="M580.0 880.0 L460.0 880.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="44" y="1016.0" font-size="10.5" fill="#6b7280">四级管道由四个私方法承担，step() 只做编排——这是 SAD「内核内部管道式分解」在方法层的落点</text>
<text x="44" y="1032.0" font-size="10.5" fill="#6b7280">非法指令分支跳过「执行 + 写回」，直接进入异常判定；与原语语义一致</text>
<text x="44" y="1048.0" font-size="10.5" fill="#6b7280">写回阶段同时向 Trace 追加一条记录；m_enabled = false 时跳过追加以换吞吐（NFR-Q1）</text>
<text x="44" y="1064.0" font-size="10.5" fill="#6b7280">m_insnLimit &gt; 0 且 insnIndex 达到上限时，按终止处理并返回（NFR-Q5 资源限额）</text>
