<text x="840.0" y="336.5" text-anchor="middle" font-size="10.5" fill="#1f2937">置 m_trap = IllegalInsn</text>
<text x="840.0" y="353.5" text-anchor="middle" font-size="10.5" fill="#1f2937">跳过执行与写回</text>
