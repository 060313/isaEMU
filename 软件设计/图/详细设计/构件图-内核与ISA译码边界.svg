<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1468 634" width="1468" height="634" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif">
<defs><marker id="tri" viewBox="0 0 14 12" refX="13.2" refY="6" markerWidth="10" markerHeight="8.6" orient="auto"><path d="M0.8 0.9 L13.2 6 L0.8 11.1 z" fill="#ffffff" stroke="#4b5563" stroke-width="1.3"/></marker><marker id="open" viewBox="0 0 12 12" refX="10.4" refY="6" markerWidth="8.4" markerHeight="8.4" orient="auto"><path d="M1.2 1.2 L10.8 6 L1.2 10.8" fill="none" stroke="#4b5563" stroke-width="1.5"/></marker><marker id="diaF" viewBox="0 0 18 12" refX="2" refY="6" markerWidth="10" markerHeight="6.8" orient="auto"><path d="M1 6 L9 1.7 L17 6 L9 10.3 z" fill="#4b5563" stroke="#4b5563" stroke-width="1.2"/></marker><marker id="diaH" viewBox="0 0 18 12" refX="2" refY="6" markerWidth="10" markerHeight="6.8" orient="auto"><path d="M1 6 L9 1.7 L17 6 L9 10.3 z" fill="#ffffff" stroke="#4b5563" stroke-width="1.3"/></marker></defs>
<rect x="0.5" y="0.5" width="1468.0" height="632.0" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
<text x="734.0" y="42" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">内核与 ISA 抽象之间的译码边界（依赖倒置）</text>
<text x="734.0" y="64" text-anchor="middle" font-size="11.5" fill="#6b7280">SS-1 与 SS-2 之间的唯一接口；描述层在执行前被编译为执行层语义，链接方向 isa → core，单向无环</text>
<line x1="44" y1="80" x2="1424.0" y2="80" stroke="#e5e7eb" stroke-width="1"/>
<text x="44" y="531.0" font-size="10.5" fill="#6b7280">编译时机：描述层 → 执行层。InsnDef 的位域与语义字符串在 DecodeTable::build() 中一次性编译为 InsnSemantic，执行期只做查表</text>
<text x="44" y="548.0" font-size="10.5" fill="#6b7280">依赖倒置：IDecodeTable 与 InsnSemantic 定义在 libisa_core 的公共头（SS-1），DecodeTable 在 libisa_isa 中实现并继承（SS-2）；因此链接方向是 isa → core</text>
<text x="44" y="565.0" font-size="10.5" fill="#6b7280">兑现效果一：内核链接依赖为零 —— 既没有 json、也没有「描述文件」概念，NFR-I2 与 DD-7 由这一条边界同时成立</text>
<text x="44" y="582.0" font-size="10.5" fill="#6b7280">兑现效果二：EmulatorCore 不再认识 funct7 / 掩码 / 位域宽度，它只认识「取第 k 个字段」与 10 类语义模板；新增 RV32I 之外的指令在多数情况下是纯数据工作</text>
<text x="44" y="599.0" font-size="10.5" fill="#6b7280">现实限制 L5（诚实声明）：若新指令需要既有 10 类模板之外的语义类别，内核的模板分派表必须扩展 —— 这是 NFR-I1「不修改内核即可扩展」的边界，不是无边界</text>
<rect x="44.0" y="104.0" width="300.0" height="161.0" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<path d="M48.0 104.0 h292.0 a4 4 0 0 1 4 4 v45.0 h-300.0 v-45.0 a4 4 0 0 1 4 -4 z" fill="#7c3aed" opacity="0.13"/>
