<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 810" width="940" height="810" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif">
<defs><marker id="arr" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="8.6" markerHeight="8.6" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="#4b5563"/></marker></defs>
<rect x="0.5" y="0.5" width="939.0" height="809.0" fill="#ffffff" stroke="#e5e7eb"/>
<text x="470.0" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">EmulatorCore 类对象状态图</text>
<text x="470.0" y="61" text-anchor="middle" font-size="11.5" fill="#6b7280">程序映像装载后进入就绪态；执行受状态机约束，终止与异常为终态</text>
<line x1="44" y1="78" x2="896.0" y2="78" stroke="#e5e7eb"/>
<circle cx="150" cy="150" r="10" fill="#111827"/>
<rect x="110.0" y="190.0" width="190.0" height="54.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/>
<text x="205.0" y="221.5" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">Uninitialized</text>
<rect x="110.0" y="300.0" width="190.0" height="54.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<text x="205.0" y="331.5" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">Ready</text>
<rect x="110.0" y="420.0" width="190.0" height="54.0" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<text x="205.0" y="451.5" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">Running</text>
<rect x="420.0" y="420.0" width="170.0" height="54.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.6"/>
<text x="505.0" y="451.5" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">Paused</text>
<rect x="110.0" y="560.0" width="190.0" height="54.0" rx="10" fill="#ffffff" stroke="#374151" stroke-width="1.6"/>
<text x="205.0" y="591.5" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">Terminated</text>
<rect x="700.0" y="300.0" width="170.0" height="54.0" rx="10" fill="#ffffff" stroke="#be123c" stroke-width="1.6"/>
<text x="785.0" y="331.5" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">Faulted</text>
<path d="M150.0 160.0 L150.0 190.0" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<path d="M150.0 244.0 L150.0 300.0" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<text x="165.0" y="276.0" text-anchor="start" font-size="10" fill="#1f2937">init(prog, entryPC, sp)</text>
<path d="M150.0 354.0 L150.0 420.0" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<text x="165.0" y="390.0" text-anchor="start" font-size="10" fill="#1f2937">step() / run(n)</text>
<path d="M300.0 447.0 L420.0 447.0" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<text x="360.0" y="438.0" text-anchor="middle" font-size="10" fill="#1f2937">pause()</text>
<path d="M505.0 474.0 L505.0 502.0 L240.0 502.0 L240.0 474.0" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<text x="372.0" y="496.0" text-anchor="middle" font-size="10" fill="#1f2937">step() / run(n)</text>
<path d="M150.0 474.0 L150.0 560.0" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<text x="165.0" y="522.0" text-anchor="start" font-size="10" fill="#1f2937">checkTermination() == true</text>
<path d="M300.0 434.0 L350.0 434.0 L350.0 327.0 L700.0 327.0" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<text x="500.0" y="319.0" text-anchor="middle" font-size="10" fill="#1f2937">checkException() ≠ None</text>
<path d="M205.0 614.0 L205.0 642.0 L80.0 642.0 L80.0 214.0 L110.0 214.0" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<text x="232.0" y="636.0" text-anchor="start" font-size="10" fill="#1f2937">reset()</text>
<path d="M785.0 354.0 L785.0 702.0 L60.0 702.0 L60.0 232.0 L110.0 232.0" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<text x="430.0" y="696.0" text-anchor="start" font-size="10" fill="#1f2937">reset()</text>
<text x="44" y="762.0" font-size="10.5" fill="#6b7280">reset() 可从 Terminated / Faulted 回到 Uninitialized，因此该状态机可反复使用（UC-03 重新装载程序）</text>
<text x="44" y="778.0" font-size="10.5" fill="#6b7280">Paused 是断点命中或用户暂停后的状态，再次 step() / run(n) 即恢复 Running</text>
<text x="44" y="794.0" font-size="10.5" fill="#6b7280">Terminated（命中终止序列）与 Faulted（运行期异常）都是终态，只能经 reset() 退出</text>
</svg>
