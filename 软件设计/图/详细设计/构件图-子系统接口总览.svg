<rect x="0.5" y="0.5" width="958.0" height="1242.0" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
<text x="479.0" y="42" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">子系统与构件接口总览</text>
<text x="479.0" y="64" text-anchor="middle" font-size="11.5" fill="#6b7280">7 个子系统 · 35 个构件；框内上栏为职责、下栏为构件清单；连线标注「使用者需求接口 → 提供者提供接口」</text>
<line x1="44" y1="80" x2="914.0" y2="80" stroke="#e5e7eb" stroke-width="1"/>
<text x="44" y="1141.0" font-size="10.5" fill="#6b7280">接口名称与稳定性分级承 SAD 5.10：冻结级 / 稳定级 / 可演进级；本阶段补出 IQuotaGuard 与 IDecodeTable 两条端口</text>
<text x="44" y="1158.0" font-size="10.5" fill="#6b7280">SS-6 与 SS-5 同属服务与集成层，为进程内直接调用；SS-7 只经 HTTP / WebSocket 访问 SS-6，不存在编译期依赖</text>
<text x="44" y="1175.0" font-size="10.5" fill="#6b7280">SS-1 与 SS-2 之间只有一条边：IDecodeTable 由内核定义、由 SS-2 的 DecodeTable 实现（依赖倒置，见「构件图-内核与ISA译码边界.svg」）</text>
<text x="44" y="1192.0" font-size="10.5" fill="#6b7280">SS-3 与 SS-4 只被 SS-5 使用，彼此不互相依赖；二者都只依赖内核的公共头（Snapshot / DiffField / StateRecord）</text>
<text x="44" y="1209.0" font-size="10.5" fill="#6b7280">Bootstrapper 是本次子系统/构件设计新增的构件（SS-6）：全系统唯一的组合根，详见「活动图-服务端构件装配与启动.svg」</text>
