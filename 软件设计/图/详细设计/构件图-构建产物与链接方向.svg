<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1985 603" width="1985" height="603" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif">
<defs><marker id="tri" viewBox="0 0 14 12" refX="13.2" refY="6" markerWidth="10" markerHeight="8.6" orient="auto"><path d="M0.8 0.9 L13.2 6 L0.8 11.1 z" fill="#ffffff" stroke="#4b5563" stroke-width="1.3"/></marker><marker id="open" viewBox="0 0 12 12" refX="10.4" refY="6" markerWidth="8.4" markerHeight="8.4" orient="auto"><path d="M1.2 1.2 L10.8 6 L1.2 10.8" fill="none" stroke="#4b5563" stroke-width="1.5"/></marker><marker id="diaF" viewBox="0 0 18 12" refX="2" refY="6" markerWidth="10" markerHeight="6.8" orient="auto"><path d="M1 6 L9 1.7 L17 6 L9 10.3 z" fill="#4b5563" stroke="#4b5563" stroke-width="1.2"/></marker><marker id="diaH" viewBox="0 0 18 12" refX="2" refY="6" markerWidth="10" markerHeight="6.8" orient="auto"><path d="M1 6 L9 1.7 L17 6 L9 10.3 z" fill="#ffffff" stroke="#4b5563" stroke-width="1.3"/></marker></defs>
<rect x="0.5" y="0.5" width="1984.7" height="601.0" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
<text x="992.4" y="42" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">构建产物与链接方向（分层规则的强制点）</text>
<text x="992.4" y="64" text-anchor="middle" font-size="11.5" fill="#6b7280">四条断言由 CMake 断言目标执行；把「分层单向」「内核零依赖」从口头约定变成编译期约束</text>
<line x1="44" y1="80" x2="1940.7" y2="80" stroke="#e5e7eb" stroke-width="1"/>
<text x="44" y="483.0" font-size="10.5" fill="#6b7280">web/dist 不参与链接：它经 Nginx（云）或内嵌静态服务（本地）托管，运行期经 HTTP / WebSocket 访问 isa_server（DD-8）</text>
<text x="44" y="500.0" font-size="10.5" fill="#6b7280">断言 A（NFR-I2）：libisa_core 的链接行只允许 C++ 标准库；出现 json / boost / pq / sqlite3 即构建失败</text>
<text x="44" y="517.0" font-size="10.5" fill="#6b7280">断言 B（分层单向）：构建脚本禁止 libisa_core → 任何库的链接边；libisa_isa 实现内核的 IDecodeTable 属于反向（向下）依赖，允许</text>
<text x="44" y="534.0" font-size="10.5" fill="#6b7280">断言 C：web/dist 目标下不得出现任何 C++ 目标，前端与内核之间不存在编译期依赖</text>
<text x="44" y="551.0" font-size="10.5" fill="#6b7280">断言 D：core_only 目标只编译 SS-1 并运行 doctest，在无网络、无数据库的环境下必须全绿 —— 这是 NFR-I2 的可执行判定</text>
<text x="44" y="568.0" font-size="10.5" fill="#6b7280">libisa_svc 对 libisa_core 的直接依赖由 CMake 的 PUBLIC 传递闭包解析，构建文件中不重复声明；libisa_core 位于依赖链最底端</text>
<rect x="44.0" y="104.0" width="340.0" height="104.0" rx="4" fill="#ffffff" stroke="#c026d3" stroke-width="1.5"/>
<path d="M48.0 104.0 h332.0 a4 4 0 0 1 4 4 v33.0 h-340.0 v-33.0 a4 4 0 0 1 4 -4 z" fill="#c026d3" opacity="0.13"/>
<text x="214.0" y="115.0" text-anchor="middle" font-size="9.5" fill="#6b7280">«可执行 · 服务端进程»</text>
<text x="214.0" y="139.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">isa_server</text>
<line x1="44.0" y1="145.0" x2="384.0" y2="145.0" stroke="#c026d3" stroke-width="1"/>
<text x="55.0" y="158.0" font-size="10.5" fill="#1f2937">归属 SS-6 + SS-5；组合根 Bootstrapper 在此进程内装配</text>
<text x="55.0" y="173.0" font-size="10.5" fill="#1f2937">云端三容器之一：app（Nginx + app + db）</text>
<line x1="44.0" y1="184.0" x2="384.0" y2="184.0" stroke="#d1d5db" stroke-width="1"/>
<text x="55.0" y="197.0" font-size="10.5" fill="#1f2937">链接：libisa_svc · Boost.Beast/Asio（仅本目标）</text>
<rect x="44.0" y="234.0" width="340.0" height="89.0" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<path d="M48.0 234.0 h332.0 a4 4 0 0 1 4 4 v33.0 h-340.0 v-33.0 a4 4 0 0 1 4 -4 z" fill="#d97706" opacity="0.13"/>
<text x="214.0" y="245.0" text-anchor="middle" font-size="9.5" fill="#6b7280">«构建产物 · 静态资源»</text>
<text x="214.0" y="269.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">web/dist</text>
<line x1="44.0" y1="275.0" x2="384.0" y2="275.0" stroke="#d97706" stroke-width="1"/>
<text x="55.0" y="288.0" font-size="10.5" fill="#1f2937">归属 SS-7；Nginx（云）或内嵌静态服务（本地）托管</text>
<line x1="44.0" y1="299.0" x2="384.0" y2="299.0" stroke="#d1d5db" stroke-width="1"/>
<text x="55.0" y="312.0" font-size="10.5" fill="#1f2937">外部依赖：无；运行期经 HTTP / WS 访问 isa_server</text>
<rect x="554.0" y="104.0" width="340.0" height="104.0" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
<path d="M558.0 104.0 h332.0 a4 4 0 0 1 4 4 v33.0 h-340.0 v-33.0 a4 4 0 0 1 4 -4 z" fill="#059669" opacity="0.13"/>
<text x="724.0" y="115.0" text-anchor="middle" font-size="9.5" fill="#6b7280">«静态库 · 领域服务»</text>
<text x="724.0" y="139.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">libisa_svc</text>
<line x1="554.0" y1="145.0" x2="894.0" y2="145.0" stroke="#059669" stroke-width="1"/>
<text x="565.0" y="158.0" font-size="10.5" fill="#1f2937">归属 SS-5（含数据访问层）</text>
<line x1="554.0" y1="169.0" x2="894.0" y2="169.0" stroke="#d1d5db" stroke-width="1"/>
<text x="565.0" y="182.0" font-size="10.5" fill="#1f2937">链接：libisa_isa · libisa_cmp · libisa_adapt</text>
<text x="565.0" y="197.0" font-size="10.5" fill="#1f2937">外部依赖：libpq（云） / sqlite3（本地）</text>
<rect x="1064.0" y="104.0" width="340.0" height="104.0" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<path d="M1068.0 104.0 h332.0 a4 4 0 0 1 4 4 v33.0 h-340.0 v-33.0 a4 4 0 0 1 4 -4 z" fill="#7c3aed" opacity="0.13"/>
<text x="1234.0" y="115.0" text-anchor="middle" font-size="9.5" fill="#6b7280">«静态库 · ISA 抽象»</text>
<text x="1234.0" y="139.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">libisa_isa</text>
<line x1="1064.0" y1="145.0" x2="1404.0" y2="145.0" stroke="#7c3aed" stroke-width="1"/>
<text x="1075.0" y="158.0" font-size="10.5" fill="#1f2937">归属 SS-2；实现并继承内核的 IDecodeTable</text>
<line x1="1064.0" y1="169.0" x2="1404.0" y2="169.0" stroke="#d1d5db" stroke-width="1"/>
<text x="1075.0" y="182.0" font-size="10.5" fill="#1f2937">链接：libisa_core</text>
<text x="1075.0" y="197.0" font-size="10.5" fill="#1f2937">外部依赖：nlohmann/json（仅本库内可见）</text>
<rect x="1064.0" y="234.0" width="340.0" height="89.0" rx="4" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
<path d="M1068.0 234.0 h332.0 a4 4 0 0 1 4 4 v33.0 h-340.0 v-33.0 a4 4 0 0 1 4 -4 z" fill="#0891b2" opacity="0.13"/>
<text x="1234.0" y="245.0" text-anchor="middle" font-size="9.5" fill="#6b7280">«静态库 · 比对»</text>
<text x="1234.0" y="269.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">libisa_cmp</text>
<line x1="1064.0" y1="275.0" x2="1404.0" y2="275.0" stroke="#0891b2" stroke-width="1"/>
<text x="1075.0" y="288.0" font-size="10.5" fill="#1f2937">归属 SS-3；被 libisa_svc 与 libisa_adapt 使用</text>
<line x1="1064.0" y1="299.0" x2="1404.0" y2="299.0" stroke="#d1d5db" stroke-width="1"/>
<text x="1075.0" y="312.0" font-size="10.5" fill="#1f2937">链接：libisa_core（Snapshot / DiffField）</text>
<rect x="1064.0" y="349.0" width="340.0" height="104.0" rx="4" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
<path d="M1068.0 349.0 h332.0 a4 4 0 0 1 4 4 v33.0 h-340.0 v-33.0 a4 4 0 0 1 4 -4 z" fill="#ea580c" opacity="0.13"/>
<text x="1234.0" y="360.0" text-anchor="middle" font-size="9.5" fill="#6b7280">«静态库 · 外部适配»</text>
<text x="1234.0" y="384.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">libisa_adapt</text>
<line x1="1064.0" y1="390.0" x2="1404.0" y2="390.0" stroke="#ea580c" stroke-width="1"/>
<text x="1075.0" y="403.0" font-size="10.5" fill="#1f2937">归属 SS-4；端口—适配器封装外部系统</text>
<line x1="1064.0" y1="414.0" x2="1404.0" y2="414.0" stroke="#d1d5db" stroke-width="1"/>
<text x="1075.0" y="427.0" font-size="10.5" fill="#1f2937">链接：libisa_cmp（StateRecord）</text>
<text x="1075.0" y="442.0" font-size="10.5" fill="#1f2937">外部依赖：无（子进程经 ProcessRunner 启动）</text>
<rect x="1574.0" y="104.0" width="366.7" height="104.0" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<path d="M1578.0 104.0 h358.7 a4 4 0 0 1 4 4 v33.0 h-366.7 v-33.0 a4 4 0 0 1 4 -4 z" fill="#2563eb" opacity="0.13"/>
<text x="1757.4" y="115.0" text-anchor="middle" font-size="9.5" fill="#6b7280">«静态库 · 模拟执行内核»</text>
<text x="1757.4" y="139.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">libisa_core</text>
<line x1="1574.0" y1="145.0" x2="1940.7" y2="145.0" stroke="#2563eb" stroke-width="1"/>
<text x="1585.0" y="158.0" font-size="10.5" fill="#1f2937">归属 SS-1；链接依赖为零</text>
<text x="1585.0" y="173.0" font-size="10.5" fill="#1f2937">独立构建目标 core_only：无网络、无数据库环境下编译并跑 doctest</text>
<line x1="1574.0" y1="184.0" x2="1940.7" y2="184.0" stroke="#d1d5db" stroke-width="1"/>
<text x="1585.0" y="197.0" font-size="10.5" fill="#1f2937">外部依赖：无 —— 仅 C++ 标准库</text>
