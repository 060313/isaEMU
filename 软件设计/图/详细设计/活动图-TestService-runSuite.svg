<text x="44" y="1166.0" font-size="10.5" fill="#6b7280">每轮循环新建独立的 EmulatorCore 与 RunContext，用例之间互不影响（NFR-Q2 的唯一落点）</text>
<text x="44" y="1182.0" font-size="10.5" fill="#6b7280">单个用例失败（异常 / 超时 / 越界）只把该用例判为失败，不中断整个用例集</text>
<text x="44" y="1198.0" font-size="10.5" fill="#6b7280">判定统一走 CompareEngine：终态模式用 compareFinal()，逐条模式用 compareSeq()（FR-6.5）</text>
<text x="44" y="1214.0" font-size="10.5" fill="#6b7280">每次循环结束必须 drop() 释放上下文，否则批量执行会累积内存</text>
