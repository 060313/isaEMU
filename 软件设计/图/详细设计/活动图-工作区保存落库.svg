<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1160" width="1300" height="1160" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif">
<defs><marker id="arr" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="8.6" markerHeight="8.6" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="#4b5563"/></marker></defs>
<rect x="0.5" y="0.5" width="1299.0" height="1159.0" fill="#ffffff" stroke="#e5e7eb"/>
<text x="650.0" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">UC-12 保存工作区 —— 数据操作活动图</text>
<text x="650.0" y="61" text-anchor="middle" font-size="11.5" fill="#6b7280">自上而下是完整的数据操作序列；右侧为三条拒绝 / 回滚出口，全部汇入失败终止</text>
<line x1="44" y1="78" x2="1256.0" y2="78" stroke="#e5e7eb"/>
<circle cx="300.0" cy="108.0" r="10" fill="#111827"/>
<path d="M300.0 118.0 L300.0 142.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="140.0" y="142.0" width="320.0" height="37.0" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<rect x="145.0" y="149.0" width="3.5" height="23.0" rx="1.8" fill="#2563eb" opacity="0.75"/>
<text x="300.0" y="164.5" text-anchor="middle" font-size="10.5" fill="#1f2937">接收保存请求 (uid, wsName, 内容实体)</text>
<path d="M300.0 179.0 L300.0 209.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="140.0" y="209.0" width="320.0" height="54.0" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<rect x="145.0" y="216.0" width="3.5" height="40.0" rx="1.8" fill="#2563eb" opacity="0.75"/>
<text x="300.0" y="231.5" text-anchor="middle" font-size="10.5" fill="#1f2937">① 校验工作区归属</text>
<text x="300.0" y="248.5" text-anchor="middle" font-size="10.5" fill="#1f2937">SELECT uid FROM workspace WHERE ws_id = ?</text>
<path d="M300.0 263.0 L300.0 289.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
<polygon points="300.0,289.0 418.0,327.0 300.0,365.0 182.0,327.0" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="300.0" y="331.0" text-anchor="middle" font-size="10.5" fill="#1f2937">归属不符？</text>
<path d="M300.0 365.0 L300.0 395.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="140.0" y="395.0" width="320.0" height="54.0" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<rect x="145.0" y="402.0" width="3.5" height="40.0" rx="1.8" fill="#2563eb" opacity="0.75"/>
<text x="300.0" y="417.5" text-anchor="middle" font-size="10.5" fill="#1f2937">② 统计资源占用</text>
<text x="300.0" y="434.5" text-anchor="middle" font-size="10.5" fill="#1f2937">SELECT COUNT(*), SUM(LENGTH(image))</text>
<path d="M300.0 449.0 L300.0 475.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
<polygon points="300.0,475.0 418.0,513.0 300.0,551.0 182.0,513.0" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="300.0" y="517.0" text-anchor="middle" font-size="10.5" fill="#1f2937">超配额？</text>
<path d="M300.0 551.0 L300.0 581.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="320.9" y="559.0" width="18.2" height="17" rx="3" fill="#ffffff"/>
<text x="330.0" y="571.0" text-anchor="start" font-size="10" fill="#b45309">否</text>
<rect x="140.0" y="581.0" width="320.0" height="40.0" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<rect x="145.0" y="588.0" width="3.5" height="26.0" rx="1.8" fill="#7c3aed" opacity="0.75"/>
<text x="300.0" y="605.0" text-anchor="middle" font-size="10.5" fill="#1f2937">③ BEGIN 事务</text>
<path d="M300.0 621.0 L300.0 649.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="140.0" y="649.0" width="320.0" height="54.0" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<rect x="145.0" y="656.0" width="3.5" height="40.0" rx="1.8" fill="#2563eb" opacity="0.75"/>
<text x="300.0" y="671.5" text-anchor="middle" font-size="10.5" fill="#1f2937">④ UPSERT workspace</text>
<text x="300.0" y="688.5" text-anchor="middle" font-size="10.5" fill="#1f2937">(ws_id, uid, name, updated_at)</text>
<path d="M300.0 703.0 L300.0 731.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="140.0" y="731.0" width="320.0" height="54.0" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<rect x="145.0" y="738.0" width="3.5" height="40.0" rx="1.8" fill="#2563eb" opacity="0.75"/>
<text x="300.0" y="753.5" text-anchor="middle" font-size="10.5" fill="#1f2937">⑤ UPSERT program ×n</text>
<text x="300.0" y="770.5" text-anchor="middle" font-size="10.5" fill="#1f2937">image 以 BLOB 落库</text>
<path d="M300.0 785.0 L300.0 813.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="140.0" y="813.0" width="320.0" height="54.0" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<rect x="145.0" y="820.0" width="3.5" height="40.0" rx="1.8" fill="#2563eb" opacity="0.75"/>
<text x="300.0" y="835.5" text-anchor="middle" font-size="10.5" fill="#1f2937">⑥ UPSERT test_suite / test_case</text>
<text x="300.0" y="852.5" text-anchor="middle" font-size="10.5" fill="#1f2937">expect_* 以 JSON 文本落库</text>
<path d="M300.0 867.0 L300.0 895.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="140.0" y="895.0" width="320.0" height="40.0" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<rect x="145.0" y="902.0" width="3.5" height="26.0" rx="1.8" fill="#7c3aed" opacity="0.75"/>
<text x="300.0" y="919.0" text-anchor="middle" font-size="10.5" fill="#1f2937">⑦ COMMIT</text>
<path d="M300.0 935.0 L300.0 963.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="140.0" y="963.0" width="320.0" height="40.0" rx="9" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
<rect x="145.0" y="970.0" width="3.5" height="26.0" rx="1.8" fill="#059669" opacity="0.75"/>
<text x="300.0" y="987.0" text-anchor="middle" font-size="10.5" fill="#1f2937">⑧ 返回 ws_id 与占用统计</text>
<path d="M300.0 1003.0 L300.0 1029.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="300.0" cy="1042.0" r="13" fill="none" stroke="#111827" stroke-width="1.6"/>
<circle cx="300.0" cy="1042.0" r="6.5" fill="#111827"/>
<rect x="590.0" y="300.0" width="300.0" height="54.0" rx="9" fill="#ffffff" stroke="#be123c" stroke-width="1.5"/>
<rect x="595.0" y="307.0" width="3.5" height="40.0" rx="1.8" fill="#be123c" opacity="0.75"/>
<text x="740.0" y="322.5" text-anchor="middle" font-size="10.5" fill="#1f2937">拒绝：工作区不属于该用户</text>
<text x="740.0" y="339.5" text-anchor="middle" font-size="10.5" fill="#1f2937">返回 403 权限错误</text>
<path d="M418.0 327.0 L590.0 327.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="494.9" y="305.0" width="18.2" height="17" rx="3" fill="#ffffff"/>
<text x="504.0" y="317.0" text-anchor="middle" font-size="10" fill="#b45309">是</text>
<rect x="650.0" y="494.0" width="300.0" height="37.0" rx="9" fill="#ffffff" stroke="#be123c" stroke-width="1.5"/>
<rect x="655.0" y="501.0" width="3.5" height="23.0" rx="1.8" fill="#be123c" opacity="0.75"/>
<text x="800.0" y="516.5" text-anchor="middle" font-size="10.5" fill="#1f2937">拒绝：返回剩余额度（UC-14）</text>
<path d="M418.0 513.0 L650.0 513.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="524.9" y="491.0" width="18.2" height="17" rx="3" fill="#ffffff"/>
<text x="534.0" y="503.0" text-anchor="middle" font-size="10" fill="#b45309">是</text>
<rect x="920.0" y="845.0" width="300.0" height="54.0" rx="9" fill="#ffffff" stroke="#be123c" stroke-width="1.5"/>
<rect x="925.0" y="852.0" width="3.5" height="40.0" rx="1.8" fill="#be123c" opacity="0.75"/>
<text x="1070.0" y="867.5" text-anchor="middle" font-size="10.5" fill="#1f2937">ROLLBACK 回滚事务</text>
<text x="1070.0" y="884.5" text-anchor="middle" font-size="10.5" fill="#1f2937">返回 500 错误码</text>
<path d="M460.0 840.0 L880.0 840.0 L880.0 872.0 L920.0 872.0" fill="none" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<rect x="664.9" y="818.0" width="70.1" height="17" rx="3" fill="#ffffff"/>
<text x="700.0" y="830.0" text-anchor="middle" font-size="10" fill="#b45309">⑥ 任一步失败</text>
<path d="M610.0 354.0 L610.0 1010.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M800.0 531.0 L800.0 1010.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M1070.0 899.0 L1070.0 1010.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="600.0" y1="1010.0" x2="1120.0" y2="1010.0" stroke="#374151" stroke-width="4"/>
<path d="M905.0 1010.0 L905.0 1016.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="905.0" cy="1030.0" r="13" fill="none" stroke="#111827" stroke-width="1.6"/>
<circle cx="905.0" cy="1030.0" r="6.5" fill="#111827"/>
<text x="44" y="1096.0" font-size="10.5" fill="#6b7280">归属校验与配额统计都带 uid 条件：多用户隔离不靠数据库权限，而靠每条语句的归属谓词（FR-9.5、NFR-Q5）</text>
<text x="44" y="1112.0" font-size="10.5" fill="#6b7280">BEGIN…COMMIT 之间的 workspace / program / test_suite / test_case 四类 UPSERT 构成一个事务——报告与用例不允许半写状态</text>
<text x="44" y="1128.0" font-size="10.5" fill="#6b7280">UPSERT 用 ON CONFLICT … DO UPDATE：PostgreSQL 与 SQLite 语法一致，DML 因此只有一套</text>
<text x="44" y="1144.0" font-size="10.5" fill="#6b7280">配额不足时不进入事务（在第 2 个决策点即返回），避免无谓地占用连接与锁</text>
</svg>
