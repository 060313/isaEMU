<svg viewBox="0 0 680 276" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" role="img">
<title>ISA 模拟系统本地部署图</title>
<desc>用户主机上运行浏览器与单文件可执行 isa-sim，数据存于 SQLite 文件，外部工具链与 Spike 由用户自行安装。</desc>
<defs>
<marker id="arl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="26" font-size="14" font-weight="500" fill="#2C2C2A">本地部署形态 · 单可执行文件 + SQLite</text>
<text x="40" y="44" font-size="12" fill="#5F5E5A">无需容器与外部数据库；前端静态资源内嵌于可执行文件，与云端形态功能对等。</text>

<rect x="56" y="60" width="584" height="196" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="68" y="78" font-size="13" font-weight="500" fill="#0C447C">«device» 用户主机（Windows / Linux）</text>

<rect x="68" y="88" width="172" height="64" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
<text x="154" y="107" font-size="13" fill="#042C53" text-anchor="middle">浏览器</text>
<text x="154" y="124" font-size="12" fill="#185FA5" text-anchor="middle">«executionEnvironment»</text>
<text x="154" y="140" font-size="12" fill="#185FA5" text-anchor="middle">访问 localhost:8080</text>

<path d="M240 120L256 120" stroke="#185FA5" stroke-width="1" fill="none" marker-end="url(#arl)"/>

<rect x="258" y="88" width="172" height="64" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
<text x="344" y="107" font-size="13" fill="#042C53" text-anchor="middle">isa-sim</text>
<text x="344" y="124" font-size="12" fill="#185FA5" text-anchor="middle">«artifact» 单文件可执行</text>
<text x="344" y="140" font-size="12" fill="#185FA5" text-anchor="middle">服务端 + 内核 + 内嵌前端</text>

<path d="M430 120L446 120" stroke="#185FA5" stroke-width="1" fill="none" marker-end="url(#arl)"/>

<rect x="448" y="88" width="172" height="64" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
<text x="534" y="107" font-size="13" fill="#042C53" text-anchor="middle">local.db</text>
<text x="534" y="124" font-size="12" fill="#185FA5" text-anchor="middle">«artifact» SQLite 文件</text>
<text x="534" y="140" font-size="12" fill="#185FA5" text-anchor="middle">用户 · 工作区 · 用例集</text>

<path d="M344 152L344 166" stroke="#185FA5" stroke-width="1" fill="none" marker-end="url(#arl)"/>

<rect x="68" y="168" width="552" height="64" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5" stroke-dasharray="5 3"/>
<text x="344" y="189" font-size="12" fill="#042C53" text-anchor="middle">«artifact» 外部进程（随部署包提供，或由用户自行安装）</text>
<text x="344" y="206" font-size="12" fill="#185FA5" text-anchor="middle">riscv-gnu-toolchain（汇编） · Spike（--log-commits 对拍基准）</text>
<text x="344" y="222" font-size="12" fill="#5F5E5A" text-anchor="middle">缺失时：汇编源路径不可用、对拍退化为快照断言比对</text>
</svg>
