<text x="40.0" y="818.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· ③ 的界面内校验在提交前实时进行：十六进制格式、基址 4 字节对齐、起始 PC 落在映像范围内、栈指针对齐；不通过则提交按钮禁用。</text>
<text x="40.0" y="834.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· ⑤~⑥ 是 ② 的失败分支：工具链缺失或汇编报错时，把错误行回填到 UI-03 并停留在本界面，不发生跳转（FR-2.2 要求「给出明确提示而不静默失败」）。</text>
<text x="40.0" y="850.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· J-13 的方向是「返回」：装载成功后回到主界面并刷新四类视图；携带机器码映像与初始 PC / SP / 内存初值。</text>
<text x="40.0" y="866.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· ⑬ 经调试服务转发给内核（图中省略 DebugService 这一跳，与 SAD 8.3 的单步热路径一致）；⑮ 的「高亮本步变化」是 NFR-Q3 的界面落点。</text>
