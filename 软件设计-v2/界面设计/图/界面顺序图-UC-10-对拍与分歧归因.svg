<text x="40.0" y="818.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· ③ 与 ④ 是两个执行方：本内核按程序逐步执行并记录状态序列（经 ICoreService），参考模拟器以子进程 + 提交日志方式运行（FR-7.1，经 SS-4 的适配器）。</text>
<text x="40.0" y="834.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· ⑥ 的比对子集来自 UI-07 的配置（默认 PC / 32 个 GPR / 内存写 / 被改 CSR），FR-7.2；比对引擎是 FR-6.5 要求的共用引擎，测试业务线也走它。</text>
<text x="40.0" y="850.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· J-27 的方向是「前进」：仅当对拍产出分歧时出现该入口；双方逐步一致时给出「未发现分歧」结论，不出现归因入口。</text>
<text x="40.0" y="866.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· J-28 的方向是「返回」：跳回主界面并把架构状态回退到该步（触发 UC-07 的差分回退链路），携带分歧 ID 与目标步序号。</text>
