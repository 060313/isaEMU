<text x="1160.0" y="548.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.4" fill="#92400e" text-anchor="start">· 取架构状态与轨迹（UC-06）</text>
<text x="1160.0" y="564.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.4" fill="#92400e" text-anchor="start">· 状态栏显示当前 ISA 与配额</text>
<text x="40.0" y="738.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· 实线箭头＝界面操作触发的调用（对应用例交互模型的消息编号）；虚线开放箭头＝返回；折线＝界面内自调用，不发送消息。</text>
<text x="40.0" y="754.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· J-01 的方向是「替换」：登录成功后终止 UI-01 的会话路径、不保留返回历史，因此 UI-01 与 UI-02 之间没有回边。</text>
<text x="40.0" y="770.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· 失败分支：会话服务返回「账号不存在 / 口令错误 / 账号已停用」时停留在 UI-01，呈现失败原因并允许重试，不发生跳转。</text>
<text x="40.0" y="786.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· 本地形态且鉴权关闭时，「以匿名会话进入」直接跳过 ①~⑩ 建立本地会话并执行 J-03，同样落到 UI-02。</text>
