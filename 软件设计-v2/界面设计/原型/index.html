<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ISA 模拟系统 · 用户界面原型（uid 阶段三）</title>
<style>
:root{
  --primary:#2563eb; --primary-d:#1d4ed8; --success:#16a34a; --warn:#d97706;
  --danger:#dc2626; --violet:#7c3aed; --t1:#111827; --t2:#1f2937; --t3:#6b7280;
  --bd:#e5e7eb; --bg:#f9fafb; --card:#ffffff; --hi:#fef3c7; --hit:#b45309;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font:14px/1.55 "Microsoft YaHei","Segoe UI","PingFang SC",sans-serif;color:var(--t2);
  background:var(--bg);padding-bottom:46px;
}
h1,h2,h3,h4{margin:0;font-weight:600;color:var(--t1)}
code,.mono{font-family:Consolas,"Courier New",monospace}
button{font-family:inherit;font-size:13px;cursor:pointer;border-radius:4px;border:1px solid var(--bd);
  background:#fff;color:#374151;height:32px;padding:0 12px;transition:.12s}
button:hover{border-color:#9ca3af}
button:active{background:#f3f4f6}
button.p{background:var(--primary);border-color:var(--primary);color:#fff}
button.p:hover{background:var(--primary-d)}
button.d{border-color:var(--danger);color:var(--danger)}
button.d:hover{background:#fef2f2}
button.sm{height:26px;padding:0 9px;font-size:12px}
button:disabled{background:#e5e7eb;border-color:#e5e7eb;color:#9ca3af;cursor:not-allowed}
input,select,textarea{font-family:inherit;font-size:13px;height:32px;padding:0 9px;border:1px solid var(--bd);
  border-radius:4px;color:var(--t2);background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 2px #2563eb22}
input.mono{font-family:Consolas,monospace}
input[type=checkbox],input[type=radio]{width:15px!important;height:15px!important;padding:0!important;border:0!important;
  box-shadow:none!important;accent-color:var(--primary);vertical-align:-2px}
label.f input[type=checkbox],label.f input[type=radio]{width:15px!important}
a{color:var(--primary);cursor:pointer;text-decoration:none}
a:hover{text-decoration:underline}

/* ---------- 演示控制条 ---------- */
#db{position:fixed;left:0;right:0;bottom:0;height:46px;background:#111827;color:#e5e7eb;z-index:99;
  display:flex;align-items:center;gap:12px;padding:0 14px;font-size:12px}
#db b{color:#fff}
#db .tag{background:#2563eb;color:#fff;border-radius:3px;padding:2px 7px;font-weight:700}
#db .jumps{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#9ca3af}
#db .jumps i{font-style:normal;color:#7dd3fc;font-family:Consolas,monospace}
#db button{background:#1f2937;border-color:#374151;color:#e5e7eb;height:26px;font-size:12px}
#db button:hover{background:#374151}
#db select{height:26px;font-size:12px;background:#1f2937;color:#e5e7eb;border-color:#374151}

/* ---------- 外壳 ---------- */
.topbar{height:56px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;
  gap:8px;padding:0 18px;position:sticky;top:0;z-index:20}
.brand{font-weight:700;font-size:15px;color:var(--t1);margin-right:10px;cursor:pointer}
.topbar nav{display:flex;gap:2px}
.topbar nav a{padding:7px 13px;border-radius:5px;color:#4b5563;font-size:13.5px;text-decoration:none}
.topbar nav a.on{background:#eff6ff;color:var(--primary);font-weight:600}
.topbar nav a:hover{background:#f3f4f6;text-decoration:none}
.tbr{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:12.5px;color:#4b5563}
.tbr .sep{color:var(--bd)}
.acct{position:relative}
.acct .menu{position:absolute;right:0;top:30px;background:#fff;border:1px solid var(--bd);border-radius:6px;
  box-shadow:0 6px 22px #0000001a;min-width:210px;padding:6px;display:none;z-index:30}
.acct.open .menu{display:block}
.acct .menu a{display:block;padding:8px 10px;border-radius:4px;color:#374151;font-size:13px}
.acct .menu a:hover{background:#f3f4f6;text-decoration:none}
.acct .menu hr{border:0;border-top:1px solid var(--bd);margin:5px 0}

.layout{display:flex;min-height:calc(100vh - 102px)}
.sidenav{width:210px;flex:none;background:#fff;border-right:1px solid var(--bd);padding:12px 0}
.sidenav .grp{font-size:11px;color:#9ca3af;padding:8px 16px 4px;letter-spacing:.5px}
.sidenav a{display:block;padding:7px 16px;color:#374151;font-size:13px}
.sidenav a:hover{background:#f3f4f6;text-decoration:none}
.sidenav a.on{background:#eff6ff;color:var(--primary);font-weight:600;border-right:3px solid var(--primary)}
.sidenav .demo{margin-top:14px;border-top:1px dashed var(--bd);padding-top:8px}
.sidenav .demo .grp{color:#c4b5fd}
.sidenav .demo a{color:#6d28d9;font-size:12.5px}
.main{flex:1;padding:18px 22px;min-width:0}

/* ---------- 页面通用 ---------- */
.hd{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px}
.hd h1{font-size:20px}
.hd .crumb{font-size:12px;color:#9ca3af}
.hd .ha{margin-left:auto;display:flex;gap:8px}
.panel{background:#fff;border:1px solid var(--bd);border-radius:6px;margin-bottom:14px;overflow:hidden}
.panel>header{display:flex;align-items:center;gap:10px;padding:9px 14px;background:#f8fafc;border-bottom:1px solid var(--bd)}
.panel>header h3{font-size:13.5px}
.panel>header .r{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--t3)}
.panel .pb{padding:14px}
.panel>header .fold{cursor:pointer;color:#9ca3af;font-size:11px;padding:0 2px;user-select:none}
.panel>header .fold:hover{color:var(--primary)}
.panel.collapsed>.pb{display:none}
.row{display:flex;gap:14px;align-items:flex-start}
.col{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.muted{color:var(--t3);font-size:12.5px}
.hint{font-size:12px;color:var(--t3)}
label.f{display:block;margin-bottom:10px}
label.f span{display:block;font-size:12px;color:var(--t3);margin-bottom:4px}
label.f input,label.f select{width:100%}
.warn{border-color:var(--danger)}
.err{font-size:12px;color:var(--danger);margin-top:3px}

table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{background:#f3f4f6;color:var(--t3);font-weight:500;font-size:12px;text-align:left;padding:7px 10px;border-bottom:1px solid var(--bd)}
table.tbl td{padding:7px 10px;border-bottom:1px solid #f3f4f6}
table.tbl tr:hover td{background:#f9fafb}
table.tbl tr.on td{background:#eff6ff;box-shadow:inset 3px 0 0 var(--primary)}
table.tbl tr.hl td{background:var(--hi)}
table.tbl tr.bp td{background:#fee2e2}
td.mono,th.mono{font-family:Consolas,monospace}

.toast{display:flex;align-items:center;gap:9px;background:#f9fafb;border-left:4px solid var(--primary);
  border-radius:4px;padding:8px 12px;font-size:13px;margin-bottom:8px}
.toast.ok{border-color:var(--success)} .toast.no{border-color:var(--danger)}
.toast.wn{border-color:var(--warn)}
.toast .x{margin-left:auto;color:#9ca3af;cursor:pointer;font-size:12px}
.ph{border:1px dashed #cbd5e1;border-radius:5px;background:#f9fafb;color:#94a3b8;font-size:12px;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:8px}
.chip{display:inline-block;padding:1px 7px;border-radius:3px;font-size:11.5px;background:#f3f4f6;color:#4b5563}
.chip.b{background:#dbeafe;color:#1d4ed8} .chip.g{background:#dcfce7;color:#15803d}
.chip.r{background:#fee2e2;color:#b91c1c} .chip.y{background:var(--hi);color:var(--hit)}
.chip.v{background:#ede9fe;color:#6d28d9}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--bd);margin-bottom:12px}
.tabs a{padding:7px 14px;color:#4b5563;font-size:13px;border-bottom:2px solid transparent}
.tabs a.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.tabs a:hover{text-decoration:none;background:#f9fafb}
.stat{background:#fff;border:1px solid var(--bd);border-radius:6px;padding:12px 14px}
.stat .k{font-size:12px;color:var(--t3)}
.stat .v{font-size:22px;font-weight:700;color:var(--t1);line-height:1.3}
.stat .v small{font-size:13px;font-weight:400;color:var(--t3)}
.bar{height:7px;border-radius:4px;background:#e5e7eb;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--success)}
.bar i.b{background:var(--primary)}
.dlg{position:fixed;inset:0;background:#11182755;display:flex;align-items:center;justify-content:center;z-index:60}
.dlg .box{width:430px;background:#fff;border:1px solid var(--danger);border-radius:8px;padding:18px 20px}
.dlg h4{font-size:15px;margin-bottom:8px}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.cnt{text-align:center}

/* ---------- 调试工作台 ---------- */
.bar2{display:flex;align-items:center;gap:8px;background:#eff6ff;border:1px solid var(--primary);
  border-radius:6px;padding:7px 12px;margin-bottom:12px}
.bar2 .sep{width:1px;height:20px;background:#cbd5e1;margin:0 4px}
.bar2 .rt{margin-left:auto;text-align:right;font-size:12px}
.dbg{display:grid;grid-template-columns:210px minmax(0,1fr) 340px;grid-template-rows:auto auto;gap:12px}
.dbg .p1{grid-column:1;grid-row:1} .dbg .p2{grid-column:2;grid-row:1}
.dbg .p3{grid-column:3;grid-row:1} .dbg .p4{grid-column:2/4;grid-row:2}
.statusbar{margin-top:12px;background:#1f2937;color:#e5e7eb;border-radius:6px;padding:7px 14px;
  display:flex;align-items:center;gap:18px;font-size:12.5px}
.statusbar .mono{color:#e5e7eb}
.statusbar .dot{color:#4ade80}
.statusbar .r{margin-left:auto;color:#9ca3af}
.breaklist .b{background:#fee2e2;border-radius:4px;padding:6px 8px;margin-bottom:6px;font-size:12.5px;
  display:flex;align-items:center;gap:8px}
.breaklist .b .dotb{width:9px;height:9px;border-radius:50%;background:var(--danger);flex:none}
.gutter{width:18px;color:#cbd5e1;font-size:11px;text-align:center}
.code{font-family:Consolas,monospace;font-size:12.5px;background:#fbfdff;border:1px solid var(--bd);
  border-radius:5px;padding:10px 12px;line-height:1.85;overflow:auto}
.code .ln{color:#cbd5e1;display:inline-block;width:26px;text-align:right;margin-right:12px}
.code .kw{color:#7c3aed} .code .rg{color:#0369a1} .code .imm{color:var(--hit)} .code .cm{color:#9ca3af}
.steps{display:flex;align-items:center;gap:0;margin:6px 0 14px}
.steps .s{flex:1;text-align:center;font-size:12.5px;color:var(--t3);position:relative;padding-top:26px}
.steps .s:before{content:"";position:absolute;left:50%;top:6px;transform:translateX(-50%);width:14px;height:14px;
  border-radius:50%;background:#fff;border:2px solid #cbd5e1}
.steps .s:after{content:"";position:absolute;left:50%;top:12px;width:100%;height:2px;background:#e5e7eb;z-index:-1}
.steps .s:last-child:after{display:none}
.steps .s.on{color:var(--primary);font-weight:600}
.steps .s.on:before{border-color:var(--primary);background:var(--primary)}
.example{cursor:pointer;border:1px solid var(--bd);border-radius:6px;padding:12px 14px;background:#fff}
.example:hover{border-color:var(--primary);background:#f8fbff}
.example.on{border-color:var(--primary);background:#eff6ff}
.example h4{font-size:13.5px;margin-bottom:5px}
.example p{margin:0;font-size:12px;color:var(--t3)}
</style>
</head>
<body>

<div id="wrap"></div>

<div id="db">
  <span>界面原型 · uid 阶段三</span>
  <span class="tag" id="db-cur">UI-02</span>
  <span id="db-name">调试工作台（主界面）</span>
  <select id="db-jump" title="演示用：直接切换界面（不计入跳转表）"></select>
  <span class="jumps" id="db-log">尚未发生跳转</span>
  <button onclick="resetDemo()">回到起点</button>
</div>

<script>
/* =====================================================================
   0. 元数据：12 个界面 / 28 条跳转
   ===================================================================== */
const META = {
  'ui-01':['UI-01','登录与注册','平台与管理','独立界面'],
  'ui-02':['UI-02','调试工作台（主界面）','调试与观测','主界面'],
  'ui-03':['UI-03','程序装载与配置','调试与观测',''],
  'ui-04':['UI-04','ISA 管理','调试与观测',''],
  'ui-05':['UI-05','测试用例管理','测试与验证',''],
  'ui-06':['UI-06','测试报告','测试与验证',''],
  'ui-07':['UI-07','一致性对拍','一致性对拍',''],
  'ui-08':['UI-08','分歧分析与归因','一致性对拍',''],
  'ui-09':['UI-09','工作区管理','平台与管理',''],
  'ui-10':['UI-10','用户与配额管理','平台与管理',''],
  'ui-11':['UI-11','接口文档与示例','平台与管理',''],
  'ui-12':['UI-12','内置示例与新手引导','调试与观测','']
};
const DOMAIN_OF = {'ui-02':'d1','ui-03':'d1','ui-04':'d1','ui-12':'d1',
  'ui-05':'d2','ui-06':'d2','ui-07':'d3','ui-08':'d3',
  'ui-01':'d4','ui-09':'d4','ui-10':'d4','ui-11':'d4'};

/* 跳转表（编号 / 源 / 目标 / 触发元素）—— 与《界面跳转关系说明》J-01~J-28 一致 */
const JT = {
  'J-01':'ui-01→ui-02','J-02':'ui-01→ui-02','J-03':'ui-01→ui-02','J-04':'外壳→ui-01','J-05':'外壳→ui-01',
  'J-06':'外壳→ui-02','J-07':'外壳→ui-05','J-08':'外壳→ui-07','J-09':'外壳→ui-09','J-10':'外壳→ui-10',
  'J-11':'外壳→ui-11','J-12':'ui-02→ui-03','J-13':'ui-03→ui-02','J-14':'ui-02→ui-04','J-15':'ui-03→ui-04',
  'J-16':'ui-04→ui-02','J-17':'ui-02→ui-12','J-18':'ui-03→ui-12','J-19':'ui-12→ui-03','J-20':'ui-12→ui-02',
  'J-21':'ui-02→ui-09','J-22':'ui-09→ui-02','J-23':'ui-05→ui-06','J-24':'ui-05→ui-09','J-25':'ui-09→ui-05',
  'J-26':'ui-06→ui-07','J-27':'ui-07→ui-08','J-28':'ui-08→ui-02',
  'G-1':'外壳→ui-02','G-2':'返回来源'
};

let log = [];
function pushLog(j){
  const d = new Date();
  const t = ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  log.unshift(t+' '+j+' '+(JT[j]||''));
  if(log.length>14) log.pop();
  document.getElementById('db-log').innerHTML = log.map(s=>{
    const m = /^(\d\d:\d\d) (J-\d\d|G-\d) (.*)$/.exec(s);
    return m ? m[1]+' <i>'+m[2]+'</i> '+m[3] : s;
  }).join('　·　');
}
function resetDemo(){ location.hash='#ui-01'; log=[]; document.getElementById('db-log').textContent='尚未发生跳转'; }

/* =====================================================================
   1. 通用部件
   ===================================================================== */
const btn=(t,j,to,cls='')=>`<button class="${cls}" data-j="${j||''}" data-go="${to||''}">${t}</button>`;
const btnS=(t,j,to,cls='sm')=>btn(t,j,to,cls);
const link=(t,j,to)=>`<a data-j="${j||''}" data-go="${to||''}">${t}</a>`;
const panel=(t,body,right='')=>`<section class="panel"><header><h3>${t}</h3><div class="r">${right}</div></header><div class="pb">${body}</div></section>`;
const hd=(cur,title,crumb,actions='')=>`<div class="hd"><h1>${title}</h1><span class="crumb">${META[cur][2]} / ${crumb}</span><div class="ha">${actions}</div></div>`;
const toast=(kind,text)=>`<div class="toast ${kind}">${text}<span class="x">×</span></div>`;

const GLOBAL_TOAST = `<div id="shell-toast"></div>`;

function shell(cur, body){
  const on = DOMAIN_OF[cur];
  const dm = {'d1':'调试与观测','d2':'测试与验证','d3':'一致性对拍','d4':'平台与管理'};
  const nav = ['d1','d2','d3','d4'].map(k=>{
    const j = {'d1':'J-06','d2':'J-07','d3':'J-08','d4':'J-09'}[k];
    const to = {'d1':'ui-02','d2':'ui-05','d3':'ui-07','d4':'ui-09'}[k];
    return `<a class="${on===k?'on':''}" data-j="${j}" data-go="${to}">${dm[k]}</a>`;
  }).join('');
  const sn = ['d1','d2','d3','d4'].map(k=>{
    const items = Object.keys(META).filter(x=>DOMAIN_OF[x]===k)
      .map(x=>`<a class="${cur===x?'on':''}" data-go="${x}">${META[x][0].slice(3)}　${META[x][1]}</a>`).join('');
    return `<div class="grp">${dm[k]}</div>${items}`;
  }).join('');
  return `
  <div class="topbar">
    <span class="brand" data-j="G-1" data-go="ui-02">ISA 模拟系统</span>
    <nav>${nav}</nav>
    <div class="tbr">
      <span>工作区：默认</span><span class="sep">|</span>
      <span>ISA：RV32I</span><span class="sep">|</span>
      <div class="acct" id="acct">
        <a onclick="document.getElementById('acct').classList.toggle('open')">用户 ▾</a>
        <div class="menu">
          <a data-j="J-10" data-go="ui-10">用户与配额管理（平台管理员）</a>
          <a data-go="ui-09" data-j="J-09">工作区管理</a>
          <hr>
          <a data-j="J-04" data-go="ui-01">登出</a>
          <a data-j="J-05" data-go="ui-01">模拟会话空闲超时回收</a>
        </div>
      </div>
      <a data-j="J-11" data-go="ui-11">帮助 · 接口文档</a>
    </div>
  </div>
  <div class="layout">
    <aside class="sidenav">
      ${sn}
      <div class="demo">
        <div class="grp">演示说明</div>
        <div style="padding:4px 16px 8px;font-size:11.5px;color:#9ca3af;line-height:1.75">
          UI-01 是独立界面（不经外壳），已列在「平台与管理」组内。<br>
          顶栏 Logo 与「调试与观测」随时回归主界面（G-1）；各界面「返回」按来源回归（G-2）。
        </div>
      </div>
    </aside>
    <main class="main">${GLOBAL_TOAST}${body}</main>
  </div>`;
}

/* =====================================================================
   2. 12 个界面
   ===================================================================== */
const P = {};

/* ---- UI-01 登录与注册（模板 A，独立界面） ---- */
P['ui-01'] = () => {
  const form = `
  <div style="width:400px;margin:0 auto">
    <div style="text-align:center;margin-bottom:22px">
      <div style="font-size:22px;font-weight:700;color:#111827">ISA 模拟系统</div>
      <div class="muted" style="margin-top:4px">指令级模拟与调试平台 · 3.0</div>
    </div>
    <div class="panel"><div class="pb">
      ${toast('ok','部署形态：本地单机（鉴权可关闭）')}
      <label class="f"><span>用户名</span><input value="sgyb" autocomplete="off"></label>
      <label class="f"><span>口令</span><input type="password" value="········"></label>
      <div id="pwd2" style="display:none">
        <label class="f"><span>确认口令</span><input type="password" value="········"></label>
      </div>
      <div style="display:flex;gap:8px;align-items:center;margin-top:4px">
        ${btn('登 录','J-01','ui-02','p')}
        <span class="muted">没有账号？</span>${link('注册','','')}
      </div>
      <div class="hint" style="margin-top:14px;display:flex;justify-content:space-between">
        <span>本地形态可用匿名会话</span>
        <span>${link('以匿名会话进入','J-03','ui-02')}</span>
      </div>
    </div></div>
    <div class="hint cnt" style="margin-top:10px">UC-01　FR-9.4 / FR-8.2　｜　登录成功后以「替换」方式跳转主界面（J-01）</div>
  </div>`;
  return hd('ui-01','登录与注册','登录', '') + form;
};

/* ---- UI-02 调试工作台（主界面） ---- */
P['ui-02'] = () => {
  const dis = `
  <div class="bar2">
    ${btn('运行','','','p')}${btn('单步','','','p')}
    ${btn('运行')}<input class="mono" value="10" style="width:52px;height:32px">
    ${btn('暂停')}${btn('复位','','','d')}

document.addEventListener('click', e=>{
  const f = e.target.closest('[data-fold]');
  if(f){
    const pn = f.closest('.panel');
    pn.classList.toggle('collapsed');
    f.textContent = pn.classList.contains('collapsed') ? '▸' : '▾';
    return;
  }
  const t = e.target.closest('[data-go]');
  if(!t) return;
  const j = t.getAttribute('data-j');
  const to = t.getAttribute('data-go');
  if(!to) return;

window.addEventListener('hashchange', render);
