<text x="54.0" y="772.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.6" fill="#4b5563" text-anchor="start">构件划分三原则：① 变更原因一致者合并（同一用例族的服务聚为一个子系统）　② 生命周期与资源边界不同者分离（内核可独立编译为库）　③ 复用关系不同者分离（比对引擎被两条业务线共用，独立成子系统）</text>
<text x="54.0" y="787.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.6" fill="#b91c1c" text-anchor="start">SS-1 内核不链接任何第三方库；SS-3 比对引擎被 SS-5 的测试服务与对拍服务共同使用，不隶属任何一方</text>
</svg>
