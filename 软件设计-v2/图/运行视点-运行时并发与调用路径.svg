<text x="36.0" y="42.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="19.0" fill="#111827" text-anchor="start" font-weight="700">ISA 模拟系统 · 运行视点的体系结构（运行时并发与调用路径）</text>
<text x="36.0" y="66.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="start">SAD 阶段五 · 会话级并发、单步热路径与对拍冷路径</text>
<rect x="36.0" y="104.0" width="266.0" height="232.0" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="50.0" y="130.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="11.6" fill="#111827" text-anchor="start" font-weight="700">用户终端 · 浏览器</text>
<text x="50.0" y="156.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.2" fill="#374151" text-anchor="start">· 前端 SPA —— 单线程事件循环</text>
<text x="50.0" y="178.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.2" fill="#374151" text-anchor="start">· WebSocket 客户端 —— 接收状态增量</text>
<text x="50.0" y="200.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.2" fill="#374151" text-anchor="start">· 四类视图渲染与高亮（NFR-Q3）</text>
<text x="50.0" y="222.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.2" fill="#374151" text-anchor="start">· 无本系统组件安装</text>
<rect x="326.0" y="104.0" width="266.0" height="232.0" rx="7" fill="#ecfeff" stroke="#0891b2" stroke-width="1.6"/>
<text x="340.0" y="130.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="11.6" fill="#111827" text-anchor="start" font-weight="700">边缘容器 · nginx</text>
<text x="340.0" y="156.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.2" fill="#374151" text-anchor="start">· 主进程 + N 个 worker 进程</text>
<text x="340.0" y="178.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.2" fill="#374151" text-anchor="start">· TLS 终止、静态资源直出</text>
<text x="340.0" y="200.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.2" fill="#374151" text-anchor="start">· 反向代理 /api 与 /ws 升级</text>
<text x="340.0" y="222.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.2" fill="#374151" text-anchor="start">· 无业务状态，可水平重启</text>
<rect x="616.0" y="104.0" width="266.0" height="232.0" rx="7" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="630.0" y="130.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="11.6" fill="#111827" text-anchor="start" font-weight="700">应用容器 · isa-sim-server</text>
<text x="630.0" y="156.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.2" fill="#374151" text-anchor="start">· 事件循环 + 线程池（网关 / 鉴权 / 路由）</text>
<text x="630.0" y="178.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.2" fill="#374151" text-anchor="start">· 无状态服务单例（SS-3 / SS-5 / SS-6 / SS-8）</text>
<text x="630.0" y="200.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.2" fill="#374151" text-anchor="start">· 每会话一个执行内核实例，线程封闭</text>
<text x="630.0" y="222.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.2" fill="#374151" text-anchor="start">· 子进程：工具链 / Spike，即起即收（SS-4）</text>
<rect x="906.0" y="104.0" width="258.0" height="232.0" rx="7" fill="#f9fafb" stroke="#4b5563" stroke-width="1.6"/>
<text x="920.0" y="130.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="11.6" fill="#111827" text-anchor="start" font-weight="700">数据容器 · PostgreSQL 16</text>
<text x="920.0" y="156.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.2" fill="#374151" text-anchor="start">· 服务进程 + 连接池</text>
<text x="920.0" y="178.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.2" fill="#374151" text-anchor="start">· 每条语句带 uid 谓词（隔离）</text>
<text x="920.0" y="200.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.2" fill="#374151" text-anchor="start">· 仅容器网络可达，不发布端口</text>
<text x="920.0" y="222.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.2" fill="#374151" text-anchor="start">· 事务边界 = 工作区保存 / 报告落库</text>
<text x="36.0" y="372.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="11.0" fill="#b91c1c" text-anchor="start" font-weight="700">调用路径一 · 单步热路径（NFR-Q1：本地 ≤ 100 毫秒 / 云端 ≤ 300 毫秒，且不跨进程）</text>
