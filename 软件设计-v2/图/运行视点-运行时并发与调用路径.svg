<rect x="36.0" y="524.0" width="1128.0" height="76.0" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
<text x="52.0" y="546.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="10.4" fill="#111827" text-anchor="start" font-weight="700">三、并发与资源边界</text>
<text x="52.0" y="566.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.4" fill="#374151" text-anchor="start">· 会话级并发：网关与领域服务为无状态单例，可被多会话共享；执行内核实例每会话一个且线程封闭，互不干扰（FR-9.1）</text>
<text x="52.0" y="584.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.4" fill="#374151" text-anchor="start">· 用例串行：批量测试与对拍按用例顺序执行，单个用例的异常被隔离在该用例内，不牵连其余用例（NFR-Q2）</text>
<rect x="36.0" y="612.0" width="1128.0" height="76.0" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
<text x="52.0" y="634.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="10.4" fill="#111827" text-anchor="start" font-weight="700">四、生命周期与回收</text>
<text x="52.0" y="654.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.4" fill="#374151" text-anchor="start">· 内核实例随会话创建、随会话销毁；空闲会话超时回收，回收时释放其内核实例与内存映像（NFR-Q5）</text>
<text x="52.0" y="672.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.4" fill="#374151" text-anchor="start">· 外部进程即起即收并设超时上限，避免工具链或参考模拟器挂起拖垮服务进程（FR-2.2 / FR-7.5 降级的前提）</text>
</svg>
