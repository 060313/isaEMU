<text x="36.0" y="458.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="11.0" fill="#0e7490" text-anchor="start" font-weight="700">调用路径二 · 对拍冷路径（FR-7.1 / FR-7.3：跨进程调用参考模拟器后逐条比对）</text>
