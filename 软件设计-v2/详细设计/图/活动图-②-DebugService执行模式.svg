<text x="50.0" y="797.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start">【`RunMode` 五取值（本步定稿，收口 C-01 与 FR-4.3）】</text>
<text x="50.0" y="812.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start">`Step` ｜ `RunN(n)` ｜ `UntilAddr(addr)` ｜ `ToBoundary` ｜ `Continue`      ——     其中：</text>
<text x="50.0" y="827.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start">· `UntilAddr` 对应需求 E4「运行到指定地址」：连续执行至 PC 等于目标地址后暂停；</text>
<text x="50.0" y="842.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start">· `ToBoundary` 对应 FR-4.3 原文「运行至程序结束或触碰边界」，**边界 = 程序映像所占内存区间的端点**（同时受 `limit` 约束，即 NFR-Q5 的指令条数上限）；</text>
<text x="50.0" y="857.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start">· UID 阶段 C-01 曾把「边界」做成三类候选下拉（运行至下一分支 / 至映像末 / 至内存末），本步按需求原文取「至映像末」，并把 C-01 从「选择边界定义」改为「边界取值只读展示」；</text>
<text x="50.0" y="872.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start">· `Continue` 即「运行到断点」—— 断点循环在服务层展开（UC-05），内核只提供 `step`。</text>
<text x="40.0" y="972.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.6" fill="#6b7280" text-anchor="start">· 三段前置校验（会话有效 → 内核就绪 → 地址合法）全部在**执行之前**完成，任一失败即返回结构化错误，不进入内核 —— 这与 `AccessGuard` 的前置校验是同一种「快速失败」风格。</text>
<text x="40.0" y="988.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.6" fill="#6b7280" text-anchor="start">· 四种模式的差异只在「怎么调内核」：`Step` / `RunN` / `UntilAddr` / `ToBoundary` 都是**一次调用**，只有 `Continue` 是服务层的循环（每步之后查断点表）。</text>
<text x="40.0" y="1004.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.6" fill="#6b7280" text-anchor="start">· 收尾统一：无论哪种模式，返回的都是同一结构 `RunReport{ 状态快照, 结束原因, 本步写操作 }` —— 界面因此只需一套渲染逻辑（`applyDelta`）。</text>
</svg>
