<rect x="40.0" y="620.0" width="1320.0" height="101.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="50.0" y="638.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start">【为什么 SS-8 的构件是「接口 + 实现类」】</text>
<text x="50.0" y="653.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start">SAD 5.5.2 把 SS-8 的 5 个构件记为「持久化服务 / 配置服务 / 日志服务 / 标识生成 / 外部进程调用」，并以接口形式提供（`IStore` 等）。</text>
<text x="50.0" y="668.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start">本步把「接口」定为构件的**门面**（对外可见、跨层引用），把实现类定为**构件内部构成**（装配档，只被 `Bootstrapper` 看到）。</text>
<text x="50.0" y="683.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start">因此实现类 **`DbStore` / `FileConfig` / `StdLogger` / `UuidGen` / `ProcRunner` 不计入 35 个设计类** —— 35 个设计类与 SAD 的 35 个构件仍然一一对应。</text>
<text x="50.0" y="698.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start">这样处理的好处：跨层引用的一律是接口（信息隐藏），而替换实现（换数据库、换日志汇聚）不影响任何调用方。</text>
<text x="40.0" y="772.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.6" fill="#6b7280" text-anchor="start">· 5 个接口是**跨层引用**的唯一形态：SS-1 ~ SS-7 都只看到接口，看不到 `DbStore` / `FileConfig` 等实现类。</text>
<text x="40.0" y="788.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.6" fill="#6b7280" text-anchor="start">· `DbStore.scoped` 是 SA-05「每条语句带用户谓词」在代码层面的落点；`IStore` 每个方法首参为 `UserId` 使该约束由**类型系统**强制，写代码时无法遗漏。</text>
<text x="40.0" y="804.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.6" fill="#6b7280" text-anchor="start">· `IConfig` 的 `dbDriver` 与 `authEnabled` 是本地 / 云端形态唯一不同的两个配置项 —— 双形态共用一套源码（SA-09 / FR-9.2）。</text>
</svg>
