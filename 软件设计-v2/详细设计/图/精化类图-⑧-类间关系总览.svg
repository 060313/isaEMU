<text x="40.0" y="756.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.6" fill="#6b7280" text-anchor="start">· 全表 **没有 n:m 关系**：唯一可能成为多对多的是「用例集 ↔ 程序」，但设计上用例集绑定单一程序（`TestSuite` 的用例共享同一 `ProgramRef`），故为 n:1。</text>
<text x="40.0" y="776.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.6" fill="#6b7280" text-anchor="start">· 依赖关系（`---&gt;`）数量最多，不逐一列出，见第 4 章关系清单与各子系统类图；本表只列**长期持有引用**的组合 / 聚合 / 关联三类。</text>
<text x="40.0" y="796.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.6" fill="#6b7280" text-anchor="start">· 「强内聚」的落点：`EmulatorCore` 的三个 ◆ 内部件、`SessionContext` 的两个 ◆ 内部件、`TestSuite` / `TestReport` 的子项集合，都是「不独立存在」的部分整体关系。</text>
<text x="40.0" y="816.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.6" fill="#6b7280" text-anchor="start">· 「松耦合」的落点：跨子系统的 7 处引用**全部是关联到接口**（`ICoreService` / `ICompareService` / `IProcessRunner` / `IStore` …），无一处关联到具体实现类。</text>
</svg>
