<text x="1160.0" y="596.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.4" fill="#92400e" text-anchor="start">停留 UI-04，不切换当前 ISA</text>
<text x="40.0" y="820.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· 实线黑＝设计类之间的调用；蓝色＝界面跳转（方向标注「替换 / 前进 / 返回」）；虚线开放箭头＝返回。编号对应用例交互模型的消息顺序。</text>
<text x="40.0" y="836.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· 与交互模型的差别：边界类与控制类之间插入 SS-6 的 HttpGateway（分析类 ApiEndpoint 与控制类 ApiController 合并），实体类按 SAD 5.4.3 落到对应子系统。</text>
<text x="40.0" y="852.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· 新增设计元素（TerminationGuard / AccessGuard / IStore / IIdGen / IProcessRunner 等 12 项）在图中以首次出现的调用标出，来源见 SAD 5.4.4。</text>
<text x="40.0" y="868.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· 分析类 `IsaSpec` 在此**一拆为二**（方式三）：`IsaLoader` 承担描述装载与校验（启动期、一次性），`DecodeTable` 承担译码表构建与按编码查询（热路径、O(1)）——拆分理由见 SAD 5.4.4。</text>
<text x="40.0" y="884.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· ⑧ 触发 SA-01 的依赖倒置：译码契约 `IDecodeTable` 由 SS-1 定义、`DecodeTable` 实现之，内核不依赖 ISA 抽象层。</text>
<text x="40.0" y="900.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· 失败分支（FR-1.3）：校验不通过时返回 422 与问题清单，停留在 UI-04，**不切换当前 ISA**（上一套可用 ISA 保持生效）。</text>
</svg>
