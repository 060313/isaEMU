<path d="M100.0 890.0 L120.0 890.0 L120.0 255.0 L190.0 255.0" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="124.0" y="545.6" width="179.7" height="13.0" rx="2" fill="#ffffff" opacity="0.96"/>
<text x="128.0" y="554.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.4" fill="#2563eb" text-anchor="start">回到循环入口（一次迭代 = 一条指令）</text>
<rect x="40.0" y="1080.0" width="1320.0" height="129.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="50.0" y="1097.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start">【为什么取消检查在「批次边界」而不在每条指令】</text>
<text x="50.0" y="1112.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start">NFR-Q1 要求关闭轨迹时达到 10⁷ 条/秒。若每条指令都读一次原子标志，热路径会被一次内存屏障打断。取 4096 步一批，把检查成本摊到 1/4096，</text>
<text x="50.0" y="1127.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start">同时保证取消的响应延迟在亚毫秒级（10⁷ 条/秒 → 4096 步约 0.4 ms）。</text>
<text x="50.0" y="1142.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start"></text>
<text x="50.0" y="1157.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start">【轨迹开关与回退能力同开同关】</text>
<text x="50.0" y="1172.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start">`traceOn_` 为假时，`trace_-&gt;append` 被跳过，`rewindTo` 也随之不可用（SA-13）。这样关闭轨迹时的吞吐量不受影响，代价是该段执行历史不可回退 ——</text>
<text x="50.0" y="1187.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start">界面按 C-01 明确置灰，不静默失败。</text>
<text x="40.0" y="1236.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.6" fill="#6b7280" text-anchor="start">· 四个判定自上而下逐层收敛：**条数上限 → 取消 → 终止/异常 → 模式条件** —— 顺序不可颠倒（例如必须先判上限，才能保证「异常」不会被误判为「已达上限」）。</text>
<text x="40.0" y="1252.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.6" fill="#6b7280" text-anchor="start">· 循环体只有三个动作：`cycle()`（管道四段）、`arch_-&gt;apply(ops)`（差分写回）、`guard_-&gt;check()`（终止判定）—— 内核热路径上没有配额、没有断点、没有日志。</text>
<text x="40.0" y="1268.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.6" fill="#6b7280" text-anchor="start">· 每条迭代恰好产生**一条** `StepRecord`，它同时是 FR-3.3 的轨迹项、FR-4.4 的回退单位与 FR-7.2 的比对照 —— SA-13 的「一份记录三种用途」在此可见。</text>
<text x="40.0" y="1284.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.6" fill="#6b7280" text-anchor="start">· 本图为纯逻辑流程，未画异常线程（`FAULT` 经 `guard_-&gt;check` 的返回值处理，不抛异常）—— 热路径不用异常做控制流。</text>
</svg>
