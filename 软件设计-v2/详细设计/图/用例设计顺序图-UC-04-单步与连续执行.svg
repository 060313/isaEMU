<text x="1140.0" y="632.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.4" fill="#92400e" text-anchor="start">译码 O(1) 查表、无配额判断、</text>
<text x="1140.0" y="648.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.4" fill="#92400e" text-anchor="start">轨迹可关（NFR-Q1 10⁷ 条/秒）</text>
<text x="40.0" y="716.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· 实线黑＝设计类之间的调用；蓝色＝界面跳转（方向标注「替换 / 前进 / 返回」）；虚线开放箭头＝返回。编号对应用例交互模型的消息顺序。</text>
<text x="40.0" y="732.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· 与交互模型的差别：边界类与控制类之间插入 SS-6 的 HttpGateway（分析类 ApiEndpoint 与控制类 ApiController 合并），实体类按 SAD 5.4.3 落到对应子系统。</text>
<text x="40.0" y="748.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· 新增设计元素（TerminationGuard / AccessGuard / IStore / IIdGen / IProcessRunner 等 12 项）在图中以首次出现的调用标出，来源见 SAD 5.4.4。</text>
<text x="40.0" y="764.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· 分析类 `DebugController` 的「执行」职责落在 `DebugService`（方式二：`execute` 拆出 step / run / pause / reset 多方法）；真正的执行由 SS-1 的 `EmulatorCore` 完成（方式三）。</text>
<text x="40.0" y="780.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· ⑥ 的「本步写操作」记录即 SA-13 差分回退的数据源：FR-3.3 / FR-4.4 / FR-7.2 复用同一份记录，不额外引入机制；轨迹关闭时回退能力同时关闭（NFR-Q1）。</text>
<text x="40.0" y="796.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· 连续运行的**指令条数上限以参数下发**（SA-05），内核只按步计数、不持有配额状态；到达上限即返回并在 UI 呈现（C-02）。</text>
<text x="40.0" y="812.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· ⑦ 的终止判定由 `TerminationGuard` 承担（FR-3.4 / FR-3.5），不塞进执行循环——两条需求变更原因不同（SAD 5.4.4）。</text>
</svg>
