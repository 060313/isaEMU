<text x="1010.0" y="450.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.4" fill="#92400e" text-anchor="start">被裁剪的区段不可回退：</text>
<text x="1010.0" y="466.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.4" fill="#92400e" text-anchor="start">置灰 + 明确提示（C-01 / C-02）</text>
<text x="40.0" y="594.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· 实线黑＝设计类之间的调用；蓝色＝界面跳转（方向标注「替换 / 前进 / 返回」）；虚线开放箭头＝返回。编号对应用例交互模型的消息顺序。</text>
<text x="40.0" y="610.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· 与交互模型的差别：边界类与控制类之间插入 SS-6 的 HttpGateway（分析类 ApiEndpoint 与控制类 ApiController 合并），实体类按 SAD 5.4.3 落到对应子系统。</text>
<text x="40.0" y="626.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· 新增设计元素（TerminationGuard / AccessGuard / IStore / IIdGen / IProcessRunner 等 12 项）在图中以首次出现的调用标出，来源见 SAD 5.4.4。</text>
<text x="40.0" y="642.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· `Trace.rewindTo` 的实现即 **SA-13 的差分 / 日志式回退**（FR-4.4）：按逆序撤销目标步之后的写操作，不保存全量快照——全量快照在一次 10⁶ 步会话中内存量不可接受。</text>
<text x="40.0" y="658.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· 轨迹被裁剪过的区段不可回退（C-01 的三类边界语义），此时界面按 C-02 明确置灰并提示，不做静默失败。</text>
<text x="40.0" y="674.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· **回退后继续执行会截断该步之后的轨迹段**（线性差分日志的自然结果）：此项作为设计决策登记，其字段与 API 在 `sdd` 类设计阶段细化。</text>
</svg>
