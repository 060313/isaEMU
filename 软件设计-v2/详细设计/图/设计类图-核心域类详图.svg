<text x="40.0" y="696.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.6" fill="#6b7280" text-anchor="start">· `EmulatorCore` 组合 `ArchState` 与 `Trace`（◆，生命周期一致）；译码依赖 `IDecodeTable` 这一**接口**而非 `DecodeTable` 实现——SA-01 依赖倒置在类图上的落点。</text>
<text x="40.0" y="712.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.6" fill="#6b7280" text-anchor="start">· `Trace.rewindTo` 是 FR-4.4 的落点，`trim` 是配套的轨迹裁剪（SA-13）；`ArchState.apply(writes)` 接收的是差分写操作，不是全量状态。</text>
<text x="40.0" y="728.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.6" fill="#6b7280" text-anchor="start">· `CompareEngine` 同时被 `TestService`（UC-08）与 `DiffService`（UC-10）使用：FR-6.5「两种判定模式复用同一引擎」的唯一落点（SA-04）。</text>
<text x="40.0" y="744.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.6" fill="#6b7280" text-anchor="start">· 本图只给属性名与主要方法签名；参数类型、可见性、前置 / 后置条件与算法在「类设计」阶段定稿。</text>
</svg>
