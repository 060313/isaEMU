<rect x="930.0" y="430.0" width="430.0" height="161.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="940.0" y="448.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start">【关系与持久化的三条约定】</text>
<text x="940.0" y="463.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start">① `Workspace` → `Program` / `TestSuite` 是**可选组合**</text>
<text x="940.0" y="478.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start">   （0..1）：选择性保存时两者可单独缺席。</text>
<text x="940.0" y="493.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start">② `TestSuite` ◆─ `TestCase`（1:n）与 `TestReport` ◆─</text>
<text x="940.0" y="508.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start">   `CaseResult`（1:n）是**强组合**：子项不独立存在，</text>
<text x="940.0" y="523.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start">   落库时以「子表 + 外键」实现。</text>
<text x="940.0" y="538.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start">③ 全系统**不存在 n:m 关系** —— 用例集与程序是一对多</text>
<text x="940.0" y="553.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start">   （一个用例集绑定一个程序），因此数据设计阶段</text>
<text x="940.0" y="568.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start">   不需要交叉表。</text>
<text x="40.0" y="712.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.6" fill="#6b7280" text-anchor="start">· 本图 7 个类均为**持久化候选**：`Workspace` / `TestSuite` / `TestReport` 是聚合根（各自独立存取），`Program` / `TestCase` / `CaseResult` 是值对象或子项（随聚合根存取）。</text>
<text x="40.0" y="728.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.6" fill="#6b7280" text-anchor="start">· 所有 `UserId` 字段（`Workspace.owner` / `TestReport.owner`）是 SA-05「逐语句用户谓词」的依据：`IStore` 的每个方法首参都是 `UserId`，由实现类在 SQL 上附加 `WHERE owner_id = :u`。</text>
<text x="40.0" y="744.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.6" fill="#6b7280" text-anchor="start">· 断点表（见前图）亦为每会话一份，随工作区持久化。</text>
</svg>
