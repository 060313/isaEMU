<text x="40.0" y="810.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· 实线黑＝设计类之间的调用；蓝色＝界面跳转（方向标注「替换 / 前进 / 返回」）；虚线开放箭头＝返回。编号对应用例交互模型的消息顺序。</text>
<text x="40.0" y="826.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· 与交互模型的差别：边界类与控制类之间插入 SS-6 的 HttpGateway（分析类 ApiEndpoint 与控制类 ApiController 合并），实体类按 SAD 5.4.3 落到对应子系统。</text>
<text x="40.0" y="842.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· 新增设计元素（TerminationGuard / AccessGuard / IStore / IIdGen / IProcessRunner 等 12 项）在图中以首次出现的调用标出，来源见 SAD 5.4.4。</text>
<text x="40.0" y="858.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· 分析类 `ApiController` 的「鉴权 / 配额 / 分发」三段职责落在 `AccessGuard`（方式一：每段各由单个方法实现）与 `Router`（方式三，图中自 `HttpGateway` 内部分发，未单列生命线）。</text>
<text x="40.0" y="874.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· `CompareEngine` 独立于 SS-3（SA-04）：UC-08 与 UC-10 复用同一引擎，这是 **FR-6.5 的唯一落点**；两种判定模式（终态 / 逐步）由 `DiffScope` 承载。</text>
<text x="40.0" y="890.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· ⑧~⑪ 是**逐用例循环**（图中以一个用例为例）；批量执行的用例级隔离由 IStore 的用户谓词保证（SA-05）。</text>
<text x="40.0" y="906.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· ⑫ 的报告持久化经 SS-8 的 IStore，报告由 UC-09 只读呈现，两条用例不交叉修改。</text>
</svg>
