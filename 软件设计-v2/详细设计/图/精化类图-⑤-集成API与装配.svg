<text x="940.0" y="329.4" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="11.6" fill="#111827" text-anchor="start" font-weight="700">IStore</text>
<text x="942.0" y="358.4" font-family="Consolas, Courier New, monospace" font-size="8.6" fill="#1f2937" text-anchor="start">- 每个方法首参一律是 `u: UserId`</text>
<text x="942.0" y="372.0" font-family="Consolas, Courier New, monospace" font-size="8.6" fill="#1f2937" text-anchor="start">- 由实现类在**每条语句**上附加 owner 谓词</text>
<text x="942.0" y="385.6" font-family="Consolas, Courier New, monospace" font-size="8.6" fill="#1f2937" text-anchor="start">- （SA-05：不依赖数据库行级安全）</text>
<path d="M930.0 390.2 H1350.0" fill="none" stroke="#e5e7eb" stroke-width="1.0" stroke-linejoin="round" marker-end="url(#ar)"/>
<text x="942.0" y="407.2" font-family="Consolas, Courier New, monospace" font-size="8.6" fill="#0e7490" text-anchor="start">+ findUser / findUserByName / saveUser</text>
<text x="942.0" y="420.8" font-family="Consolas, Courier New, monospace" font-size="8.6" fill="#0e7490" text-anchor="start">+ queryUsers / queryUsage</text>
<text x="942.0" y="434.4" font-family="Consolas, Courier New, monospace" font-size="8.6" fill="#0e7490" text-anchor="start">+ saveSession / dropSession</text>
