<text x="942.0" y="461.6" font-family="Consolas, Courier New, monospace" font-size="8.6" fill="#0e7490" text-anchor="start">+ saveReport / getReport</text>
<text x="942.0" y="475.2" font-family="Consolas, Courier New, monospace" font-size="8.6" fill="#0e7490" text-anchor="start">+ saveBreakpoints / loadBreakpoints</text>
<text x="942.0" y="488.8" font-family="Consolas, Courier New, monospace" font-size="8.6" fill="#0e7490" text-anchor="start">+ saveDivergence / queryDivergence</text>
<rect x="930.0" y="430.0" width="430.0" height="191.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="940.0" y="448.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start">【装配顺序（`Bootstrapper.wire`）】</text>
<text x="940.0" y="463.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start">① 由 `IConfig` 选出驱动：`Postgres | Sqlite`；</text>
<text x="940.0" y="478.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start">② 构造 5 个基础服务并注入彼此（`ILogger` → `IStore`）；</text>
<text x="940.0" y="493.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start">③ 构造 SS-1 / SS-2 / SS-3 / SS-4 实现，注入 `IProcessRunner`；</text>
<text x="940.0" y="508.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start">④ 构造 7 个领域服务，注入 `IStore` / `ICoreService` /</text>
<text x="940.0" y="523.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start">   `ICompareService` / `IAssembler` / `IRefSim` / `SessionService`；</text>
<text x="940.0" y="538.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start">⑤ 构造 `AccessGuard` → `Router` → `HttpGateway`；</text>
<text x="940.0" y="553.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start">⑥ 注册路由表（`Router.register`），冻结对外契约。</text>
<text x="940.0" y="568.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start"></text>
<text x="940.0" y="583.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start">只有本类的 `build()` 里会出现 `new`；其他任何地方</text>
<text x="940.0" y="598.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.0" fill="#475569" text-anchor="start">不得构造内核、存储、适配器实例（SA-08）。</text>
<text x="40.0" y="852.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.6" fill="#6b7280" text-anchor="start">· 调用链固定为 `HttpGateway → AccessGuard → Router → 领域服务接口`；`Router` 的分发表可独立替换（增删接口不改鉴权代码，SAD 5.4.4）。</text>
<text x="40.0" y="868.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.6" fill="#6b7280" text-anchor="start">· `AccessGuard` 是 NFR-Q5 与鉴权的**唯一前置落点**（SA-05）；它的限额值来自 `IConfig`，与 UC-04 下发给内核的 `limit` 参数**同源** —— 这是 UID 评审 ⑦-1 那个悬空项在详细设计上的收口。</text>
<text x="40.0" y="884.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.6" fill="#6b7280" text-anchor="start">· `Bootstrapper` 是全系统唯一的对象装配点（SA-08）：全项目只有它的 `build()` 里出现 `new`，双形态差异（PostgreSQL ↔ SQLite、鉴权开 ↔ 关）只收敛在 `selectDrivers`。</text>
</svg>
