<text x="497.0" y="358.4" font-family="Consolas, Courier New, monospace" font-size="8.6" fill="#1f2937" text-anchor="start">- 只读配置项（全部经 Bootstrapper 注入）</text>
<text x="497.0" y="372.0" font-family="Consolas, Courier New, monospace" font-size="8.6" fill="#1f2937" text-anchor="start">- dbDriver : DriverKind        = Postgres | Sqlite</text>
<text x="497.0" y="385.6" font-family="Consolas, Courier New, monospace" font-size="8.6" fill="#1f2937" text-anchor="start">- listenAddr : Endpoint       = 0.0.0.0:8443</text>
<text x="497.0" y="399.2" font-family="Consolas, Courier New, monospace" font-size="8.6" fill="#1f2937" text-anchor="start">- authEnabled : bool               = true</text>
<text x="497.0" y="412.8" font-family="Consolas, Courier New, monospace" font-size="8.6" fill="#1f2937" text-anchor="start">- instrLimit : uint64_t       = 100000000</text>
<text x="497.0" y="426.4" font-family="Consolas, Courier New, monospace" font-size="8.6" fill="#1f2937" text-anchor="start">- sessionTimeout : Duration          = 30m</text>
<text x="497.0" y="440.0" font-family="Consolas, Courier New, monospace" font-size="8.6" fill="#1f2937" text-anchor="start">- maxSessions : uint32_t             = 64</text>
<text x="497.0" y="453.6" font-family="Consolas, Courier New, monospace" font-size="8.6" fill="#1f2937" text-anchor="start">- requestQuota : uint32_t           = 1000</text>
<text x="497.0" y="467.2" font-family="Consolas, Courier New, monospace" font-size="8.6" fill="#1f2937" text-anchor="start">- traceCapacity : size_t        = 1048576</text>
<text x="497.0" y="480.8" font-family="Consolas, Courier New, monospace" font-size="8.6" fill="#1f2937" text-anchor="start">- toolchainPath / spikePath : Path</text>
