<text x="1140.0" y="466.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.4" fill="#92400e" text-anchor="start">⑦ = 执行测试　⑧ = 发起对拍</text>
<text x="1140.0" y="482.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.4" fill="#92400e" text-anchor="start">三选一：同一请求只走一条分支</text>
<text x="40.0" y="666.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· 实线黑＝设计类之间的调用；蓝色＝界面跳转（方向标注「替换 / 前进 / 返回」）；虚线开放箭头＝返回。编号对应用例交互模型的消息顺序。</text>
<text x="40.0" y="682.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· 与交互模型的差别：边界类与控制类之间插入 SS-6 的 HttpGateway（分析类 ApiEndpoint 与控制类 ApiController 合并），实体类按 SAD 5.4.3 落到对应子系统。</text>
<text x="40.0" y="698.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· 新增设计元素（TerminationGuard / AccessGuard / IStore / IIdGen / IProcessRunner 等 12 项）在图中以首次出现的调用标出，来源见 SAD 5.4.4。</text>
<text x="40.0" y="714.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· UC-13 与 UC-08 共用同一条 `HttpGateway → AccessGuard → 领域服务` 通道：分析类 `ApiEndpoint` 的边界职责与控制类 `ApiController` 的分发职责在此合并（SAD 5.4.4）。</text>
<text x="40.0" y="730.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· ⑥ / ⑦ / ⑧ 是三条**并列分支**，同一请求只走其中一条：装载 · 单步 · 运行走 `ICoreService`，执行测试走 `TestService`，发起对拍走 `DiffService`。</text>
<text x="40.0" y="746.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· 内核调用与 UC-04 完全一致，仅调用方由 `DebugService` 换成 `Router`；因此接口文档与调用示例（FR-8.3）与 REST / WS 契约**同步维护**。</text>
<text x="40.0" y="762.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· 鉴权与配额受阻时返回 401 / 429，不进入分发（NFR-Q5 / SA-05）。</text>
</svg>
