<text x="40.0" y="774.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· 实线黑＝设计类之间的调用；蓝色＝界面跳转（方向标注「替换 / 前进 / 返回」）；虚线开放箭头＝返回。编号对应用例交互模型的消息顺序。</text>
<text x="40.0" y="790.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· 与交互模型的差别：边界类与控制类之间插入 SS-6 的 HttpGateway（分析类 ApiEndpoint 与控制类 ApiController 合并），实体类按 SAD 5.4.3 落到对应子系统。</text>
<text x="40.0" y="806.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· 新增设计元素（TerminationGuard / AccessGuard / IStore / IIdGen / IProcessRunner 等 12 项）在图中以首次出现的调用标出，来源见 SAD 5.4.4。</text>
<text x="40.0" y="822.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· 分析类 `WorkspaceController` 的持久化职责经 SS-8 的 `IStore`（方式三）：`WorkspaceService` 只负责领域语义（哪些制品入包、版本与冲突规则），数据访问不下沉到业务服务（SAD 5.7）。</text>
<text x="40.0" y="838.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· 恢复程序后**不自动执行**，只把内核置于该工作区的初态；程序与用例集通过 ⑪ / ⑫ 分别恢复到 Program 与 TestSuite（Program / TestSuite 为 SS-5 内的数据对象，图中不单列生命线）。</text>
<text x="40.0" y="854.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· 本地形态 `IStore` 走 SQLite（`workspace.db`），云端形态走 PostgreSQL，其余逻辑完全一致（**FR-9.2 双形态对等**）。</text>
</svg>
