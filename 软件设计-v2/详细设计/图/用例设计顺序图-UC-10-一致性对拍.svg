<text x="1150.0" y="536.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.4" fill="#92400e" text-anchor="start">参考模拟器不可用时</text>
<text x="1150.0" y="552.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.4" fill="#92400e" text-anchor="start">呈现降级提示、保留本内核轨迹</text>
<text x="40.0" y="692.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· 实线黑＝设计类之间的调用；蓝色＝界面跳转（方向标注「替换 / 前进 / 返回」）；虚线开放箭头＝返回。编号对应用例交互模型的消息顺序。</text>
<text x="40.0" y="708.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· 与交互模型的差别：边界类与控制类之间插入 SS-6 的 HttpGateway（分析类 ApiEndpoint 与控制类 ApiController 合并），实体类按 SAD 5.4.3 落到对应子系统。</text>
<text x="40.0" y="724.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· 新增设计元素（TerminationGuard / AccessGuard / IStore / IIdGen / IProcessRunner 等 12 项）在图中以首次出现的调用标出，来源见 SAD 5.4.4。</text>
<text x="40.0" y="740.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· ③ 与 ⑤ 是两个执行方：本内核按 `ICoreService` 逐步执行，参考模拟器以**子进程 + 提交日志**方式运行（FR-7.1，经 SS-4 的 `RefSimAdapter` → IProcessRunner）。</text>
<text x="40.0" y="756.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· ⑧ 的比对引擎与 UC-08 是**同一个** `CompareEngine`（SA-04 / FR-6.5）；比对子集来自 UI-07 的配置，默认 PC / 32 个 GPR / 内存写 / 被改 CSR（FR-7.2）。</text>
<text x="40.0" y="772.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· 降级模式（FR-7.5）：参考模拟器不可用时 `RefSimAdapter` 返回明确的「不可用」结果，UI-07 呈现降级提示并保留本内核轨迹（转自 uid 的 S-3）。</text>
<text x="40.0" y="788.0" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif" font-size="9.8" fill="#6b7280" text-anchor="start">· 双方逐步一致时不生成分歧记录，UI-07 给出「未发现分歧」结论，不出现 J-27 入口。</text>
</svg>
