# ============================================================================
# 边缘容器的 nginx 站点配置
#
# 设计依据：《软件体系结构设计文档》
#   6.2 唯一发布 443；TLS 终止；反向代理 /api 与 /ws
#   6.5 边缘容器 ↔ 应用容器：容器网络内 HTTP，路径 /api 与 /ws
# ============================================================================

# 应用容器在容器网络中的地址。
# 刻意用「变量 + resolver」而不是 upstream 块：upstream 块会在 nginx **启动时**
# 解析主机名，应用容器尚未就绪时 nginx 直接 emerg 退出；改成变量后解析推迟到
# 请求时，边缘容器始终能启动，应用未就绪时只是返回 502。
# 127.0.0.11 是 Docker 内置 DNS；若部署在 compose 网络之外，改成实际 DNS 地址。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen      443 ssl;
    http2       on;
    server_name _;

    # 应用容器在容器网络中的地址（set 只能出现在 server / location 内）
    set $isa_app "app:8080";

    # 见 Dockerfile.edge：自签名证书，生产须替换
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 前端静态资源包（SS-7 的 dist/）
    root  /usr/share/nginx/html;
    index index.html;

    # 上传 ISA 描述 / 程序映像可能较大，放宽请求体
    client_max_body_size 64m;

    # 单页应用：未知路径回落到 index.html，由前端路由接管（28 条 J-xx 跳转）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API → 应用容器
    location /api/ {
        proxy_pass         http://$isa_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # WebSocket → 应用容器（JobState / Toast 等主动推送，FR-6.4）
    location /ws {
        proxy_pass         http://$isa_app;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;   # 长连接，避免空闲被切断
        proxy_send_timeout 3600s;
    }

    # 容器健康检查（不经应用容器）
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "edge ok\n";
    }
}
