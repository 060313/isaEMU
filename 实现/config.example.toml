# ============================================================================
# ISA 模拟系统 —— 本地形态配置示例
#
# 用法：复制为 config.toml 后按需修改。
#        config.toml 已被 .gitignore 忽略，不会入库（凭据、本机路径不入版本库）。
#
# 设计依据：《软件体系结构设计文档》6.3（本地形态）、6.6（双形态对等）；
#           《软件详细设计文档》6.4.8（IConfig 九个配置项）
#
# 读取优先级：环境变量 > 本文件 > 内置默认值，由 SS-8 的 FileConfig 统一实现，
# 其余代码不出现「if 本地 / else 云端」的判断（SAD 6.6 / T5）。
# ============================================================================

# ---- 数据库 ----------------------------------------------------------------
[db]
# sqlite | postgres —— 对应 IConfig::dbDriver()
driver = "sqlite"

# 仅 SQLite 形态使用：单文件、零安装（SAD 6.3）。
# 该项超出 IConfig 的九个取值，由 DbDriver 直接读取。
path = "workspace.db"

# ---- 执行 ------------------------------------------------------------------
[execution]
# 单次运行的最大指令数 —— IConfig::instrLimit()
instr_limit = 10000000

# 轨迹容量的唯一取值点 —— IConfig::traceCapacity()
# 轨迹超出该容量后旧记录被裁剪，回退到已裁剪位置返回 ErrCode::TooOld。
trace_capacity = 4096

# 取消检查的批次间隔 —— IConfig::cancelCheckInterval()
# CancelToken 在内核热路径上按该间隔批量检查，避免每步一次原子读。
cancel_check_interval = 4096

# 会话超时（秒）—— IConfig::sessionTimeout()
session_timeout_sec = 3600

# ---- 鉴权 ------------------------------------------------------------------
[auth]
# IConfig::authEnabled()
# 本地形态可关闭，转为匿名会话（SAD 6.3 / 6.6）；云端形态必须开启。
enabled = true

# ---- 外部程序 --------------------------------------------------------------
[external]
# 工具链前缀或目录 —— IConfig::toolchainPath()
# 缺失时由 FR-2.2 给出明确提示，不静默失败（SAD 6.3）。
toolchain_path = "riscv64-unknown-elf-"

# 参考模拟器可执行文件 —— IConfig::spikePath()
spike_path = "spike"

# ---- 服务 ------------------------------------------------------------------
[server]
# 本地形态监听环回地址（SAD 6.6）；容器内为 0.0.0.0，由环境变量覆盖。
host = "127.0.0.1"

# IConfig::port()
port = 8080
